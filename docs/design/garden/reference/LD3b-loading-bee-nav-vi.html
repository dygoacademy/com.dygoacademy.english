<style>
body{margin:0}
.ld *{box-sizing:border-box}
.ld svg [class]{transform-box:fill-box}
.wl{transform-origin:center bottom;animation:flapL .16s ease-in-out infinite alternate}
.wr{transform-origin:center bottom;animation:flapR .16s ease-in-out infinite alternate}
@keyframes flapL{to{transform:scaleY(.5)}}
@keyframes flapR{to{transform:scaleY(.5)}}
.dots i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:4px;background:currentColor;opacity:.25;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{30%{opacity:1;transform:translateY(-2px)}60%{opacity:.25;transform:none}}
.lines{position:relative;height:22px;width:100%}
.lines span{position:absolute;left:0;right:0;text-align:center;opacity:0;animation:line 7.5s infinite}
.lines span:first-child{opacity:1}
.lines span:nth-child(2){animation-delay:2.5s}.lines span:nth-child(3){animation-delay:5s}
@keyframes line{0%{opacity:0;transform:translateY(6px)}5%,28%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-6px)}}
.reduced *, .reduced *::before{animation:none !important}

.beeC{offset-path:path("M195 82 C 280 80, 322 112, 322 150 C 322 190, 280 220, 195 218 C 110 220, 68 190, 68 150 C 68 112, 110 84, 195 82");offset-rotate:0deg;animation:fly 4.2s linear infinite}
@keyframes fly{from{offset-distance:0%}to{offset-distance:100%}}
.trail{stroke-dasharray:3 7;animation:trail 1s linear infinite}
@keyframes trail{to{stroke-dashoffset:-10}}
.pol{opacity:.25;animation:pol 4.2s infinite}
@keyframes pol{0%,8%{opacity:.25;r:3}12%{opacity:1;r:5}40%,100%{opacity:.25;r:3}}
.reduced .beeC{offset-distance:8%}
.face{transform-origin:center;animation:face 4.2s step-end infinite}
@keyframes face{0%{transform:scaleX(1)}25%{transform:scaleX(-1)}75%{transform:scaleX(1)}}

</style><style>*,*::before,*::after{animation:none!important;transition:none!important}</style><style type="text/css"></style></head>
