<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Pronunciation · Recording</title>

<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1EA;color:#1C2B24}
a{color:#B4552E}a:hover{color:#8A3E20}
@keyframes lvl{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.lvl{transform-box:fill-box;transform-origin:center;animation:lvl .7s ease-in-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.5);opacity:0}}
.ring{animation:ring 1.4s ease-out infinite}
@keyframes timer{0%{stroke-dashoffset:0}100%{stroke-dashoffset:289}}
.timer{animation:timer 4s linear infinite}
@keyframes splash{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.6);opacity:0}}
.splash{transform-box:fill-box;transform-origin:center;animation:splash 1.2s ease-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hop{animation:hop .6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style><style>*,*::before,*::after{animation:none!important;transition:none!important}</style><style type="text/css"></style></head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; display: flex; flex-direction: column; gap: 16px; padding: 20px 18px 26px; font-family: 'DM Sans', sans-serif; color: #1C2B24; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px">
<a href="PronStones.dc.html" style="height: 44px; padding: 0 14px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3DDD0; display: flex; align-items: center; font-size: 14px; font-weight: 700; color: #5E6A62; text-decoration: none">Cancel</a>
<span style="flex-grow: 1; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #B4552E">● Recording</span>
<span style="width: 74px; text-align: right; font-size: 13px; font-weight: 700; color: #5E6A62">Bee 1 of 3</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
<span lang="en" style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 44px; line-height: 1.05">mitigate</span>
<span style="font-size: 16px; color: #5E6A62">Keep going…</span>
</div>
<div style="border-radius: 26px; background: #24463A; padding: 0; overflow: hidden">
<svg width="100%" viewBox="0 0 334 170" role="img" aria-label="Stones light up as Dygo hears each part: MI" style="display: block; height: auto">
<path d="M0 120 Q 84 110 167 120 T 334 120 V170 H0 Z" fill="#1F3E33"></path><path d="M0 120 Q 84 110 167 120 T 334 120" fill="none" stroke="#3A5E4F" stroke-width="2"></path>
<ellipse cx="62" cy="110" rx="50" ry="22" fill="#E8C66A"></ellipse>
<ellipse cx="168" cy="116" rx="32" ry="14" fill="#5E7F70"></ellipse>
<ellipse cx="268" cy="114" rx="40" ry="17" fill="#5E7F70"></ellipse>
<ellipse class="splash" cx="62" cy="122" rx="54" ry="10" fill="none" stroke="#F2D28B" stroke-width="2"></ellipse>


<text x="62" y="118" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="24" fill="#1C2B24">MI</text>
<text x="168" y="121" text-anchor="middle" font-family="DM Sans" font-weight="600" font-size="16" fill="#F4F1EA">ti</text>
<text x="268" y="120" text-anchor="middle" font-family="DM Sans" font-weight="600" font-size="19" fill="#F4F1EA">gate</text>
<g class="hop"><g transform="translate(62,36)"><g transform="translate(0,10) scale(1.7)"><g transform="translate(-16,-17)"><ellipse cx="12" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(-25 12 9)"></ellipse><ellipse cx="20" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(25 20 9)"></ellipse><ellipse cx="16" cy="19" rx="9" ry="7" fill="#F2C744"></ellipse><path d="M12 13.2 V24.8" stroke="#3B3020" stroke-width="2.4"></path><path d="M17 12.2 V25.8" stroke="#3B3020" stroke-width="2.4"></path><circle cx="23.5" cy="17.5" r="1.3" fill="#3B3020"></circle><path d="M7 19 L5 19" stroke="#3B3020" stroke-width="1.6" stroke-linecap="round"></path></g></g></g></g>
</svg>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 12px">
<span style="font-size: 12px; font-weight: 700; color: #5E6A62; flex-shrink: 0">Your voice</span>
<svg width="100%" height="34" viewBox="0 0 220 34" preserveAspectRatio="none" aria-hidden="true">

<rect x="122" y="15" width="98" height="4" rx="2" fill="#EFEAE0"></rect>
</svg>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 10px">
<span style="font-size: 15px; font-weight: 700; color: #B4552E">Listening…</span>
<div style="position: relative; width: 108px; height: 108px; display: flex; align-items: center; justify-content: center">
<span class="ring" style="position: absolute; left: 12px; top: 12px; width: 84px; height: 84px; border-radius: 42px; background: #E8A87C"></span>
<svg width="108" height="108" viewBox="0 0 108 108" style="position: absolute; inset: 0" aria-hidden="true"><circle cx="54" cy="54" r="46" fill="none" stroke="#E3DDD0" stroke-width="5"></circle><circle class="timer" cx="54" cy="54" r="46" fill="none" stroke="#B4552E" stroke-width="5" stroke-linecap="round" stroke-dasharray="289" transform="rotate(-90 54 54)"></circle></svg>
<a href="PronStonesChecking.dc.html" aria-label="Stop recording" style="position: relative; width: 84px; height: 84px; border-radius: 42px; background: #B4552E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="3" fill="#FFFFFF"></rect></svg></a>
</div>
<span style="font-size: 13px; color: #5E6A62; text-align: center">Stops by itself when you finish · or tap to stop</span>
</div>
</div>
