body{margin:0;font-family:'Be Vietnam Pro', 'DM Sans', sans-serif;background:#F4F1EA;color:#1C2B24}
a{color:#B4552E}a:hover{color:#8A3E20}
@keyframes rise{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
.rise{animation:rise .25s ease-out}
@keyframes bloom{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.bloom{animation:bloom .7s ease-out}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 3s ease-in-out infinite}
@keyframes ripple{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.5);opacity:0}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2s ease-out infinite}
@keyframes level{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.lvl{transform-box:fill-box;transform-origin:center;animation:level .8s ease-in-out infinite}
@keyframes sink{0%{transform:translateY(-30px);opacity:0}60%{transform:translateY(4px);opacity:1}100%{transform:translateY(0)}}
.sink{animation:sink .8s ease-out}
@keyframes flutter{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-6px)}}
.flutter{animation:flutter 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}

</style><style>*,*::before,*::after{animation:none!important;transition:none!important}</style><style type="text/css"></style></head>
