<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<title>Về bạn</title>

<style>
body{margin:0;font-family:'Be Vietnam Pro', 'DM Sans', sans-serif;background:#F4F1EA;color:#1C2B24}
a{color:#B4552E}a:hover{color:#8A3E20}
@keyframes rise{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
.rise{animation:rise .25s ease-out}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style><style>*,*::before,*::after{animation:none!important;transition:none!important}</style><style type="text/css"></style></head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; display: flex; flex-direction: column; gap: 14px; padding: 22px 20px 24px; font-family: 'Be Vietnam Pro', 'DM Sans', sans-serif; color: #1C2B24; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px">
<a href="AdultRegisterVi.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3DDD0; display: flex; align-items: center; justify-content: center; color: #1C2B24; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg></a>
<div role="progressbar" aria-valuemin="1" aria-valuemax="2" aria-valuenow="1" aria-label="Bước 1/2" style="flex-grow: 1; display: flex; align-items: center; gap: 4px"><span style="width: 40px; height: 40px; border-radius: 20px; background: #24463A; display: flex; align-items: flex-end; justify-content: center; overflow: hidden"><svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="33" rx="6" ry="4" fill="#6B5040"></ellipse><path d="M20 30 C20 26 22 24 25 23" stroke="#7FA487" stroke-width="2.4" fill="none" stroke-linecap="round"></path></svg></span><span style="flex-grow: 1; height: 3px; border-radius: 2px; background: #E3DDD0"></span><span style="width: 40px; height: 40px; border-radius: 20px; border: 2px dashed #CFC6B2; box-sizing: border-box"></span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; line-height: 1.1">Cùng thiết lập khu vườn</span>
<span style="font-size: 15px; color: #5E6A62; line-height: 1.4">Hai câu hỏi nhanh. Bạn có thể đổi sau.</span>
</div>
<span style="font-size: 13px; font-weight: 700; color: #1C2B24; margin-bottom: -6px">Tiếng Anh của bạn hiện nay</span>
<div role="radiogroup" aria-label="Tiếng Anh của bạn hiện nay" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button role="radio" aria-checked="false" style="height: 60px; border-radius: 16px; border: 2px solid #E3DDD0; background: #FFFFFF; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 12px; cursor: pointer; text-align: left; font-family: inherit; color: #1C2B24"><span style="font-weight: 700; font-size: 15px">Mới bắt đầu</span><span style="font-size: 12px; font-weight: 700; color: #3E7F5A">A1–A2</span></button><button role="radio" aria-checked="false" style="height: 60px; border-radius: 16px; border: 2px solid #E3DDD0; background: #FFFFFF; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 12px; cursor: pointer; text-align: left; font-family: inherit; color: #1C2B24"><span style="font-weight: 700; font-size: 15px">Đang tiến bộ</span><span style="font-size: 12px; font-weight: 700; color: #3E7F5A">B1</span></button><button role="radio" aria-checked="true" style="height: 60px; border-radius: 16px; border: 2px solid #24463A; background: #F1F6EF; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 12px; cursor: pointer; text-align: left; font-family: inherit; color: #1C2B24"><span style="font-weight: 700; font-size: 15px">Khá vững</span><span style="font-size: 12px; font-weight: 700; color: #3E7F5A">B2</span></button><button role="radio" aria-checked="false" style="height: 60px; border-radius: 16px; border: 2px solid #E3DDD0; background: #FFFFFF; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 12px; cursor: pointer; text-align: left; font-family: inherit; color: #1C2B24"><span style="font-weight: 700; font-size: 15px">Nâng cao</span><span style="font-size: 12px; font-weight: 700; color: #3E7F5A">C1</span></button>
</div>
<span style="font-size: 12px; color: #5E6A62; margin-top: -4px">Chưa chắc? Chọn mức gần nhất, Dygo sẽ điều chỉnh khi bạn học.</span>
<span style="font-size: 13px; font-weight: 700; color: #1C2B24; margin-bottom: -6px">Bạn vun trồng cho mục tiêu nào?</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><button aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #24463A; background: #24463A; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap">IELTS Academic</button><button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #E3DDD0; background: #FFFFFF; color: #1C2B24; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap">IELTS General</button><button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #E3DDD0; background: #FFFFFF; color: #1C2B24; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap">Công việc</button><button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #E3DDD0; background: #FFFFFF; color: #1C2B24; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap">Du lịch</button><button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #E3DDD0; background: #FFFFFF; color: #1C2B24; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap">Cho bản thân</button></div>

<div class="rise" style="background: #24463A; border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; color: #F4F1EA">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #B7D6AE">Band mục tiêu</span><span style="font-size: 12px; color: #DDE7DA">Band càng cao, càng nhiều từ học thuật.</span></div>
<button aria-label="Giảm mục tiêu" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #3E6B57; background: transparent; color: #F4F1EA; font-size: 22px; cursor: pointer; font-family: inherit">–</button>
<span aria-live="polite" style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; min-width: 50px; text-align: center">7.0</span>
<button aria-label="Tăng mục tiêu" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #3E6B57; background: transparent; color: #F4F1EA; font-size: 22px; cursor: pointer; font-family: inherit">+</button>
</div>

<div style="margin-top: auto"><a href="OnboardReminderVi.dc.html" style="height: 56px; border-radius: 18px; background: #B4552E; color: #FFFFFF; box-shadow: 0 4px 0 #7E3719; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-decoration: none; width: 100%; box-sizing: border-box">Tiếp tục</a></div>
</div>
