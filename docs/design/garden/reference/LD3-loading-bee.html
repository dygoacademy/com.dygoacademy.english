<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Dygo · Loading · Bee's flight</title>

<style>
body{margin:0}
.ld *{box-sizing:border-box}
.ld svg [class]{transform-box:fill-box}
.wl{transform-origin:center bottom;animation:flapL .16s ease-in-out infinite alternate}
.wr{transform-origin:center bottom;animation:flapR .16s ease-in-out infinite alternate}
@keyframes flapL{to{transform:scaleY(.5)}}
@keyframes flapR{to{transform:scaleY(.5)}}
.dots i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:4px;background:currentColor;opacity:.25;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{30%{opacity:1;transform:translateY(-2px)}60%{opacity:.25;transform:none}}
.lines{position:relative;height:22px;width:100%}
.lines span{position:absolute;left:0;right:0;text-align:center;opacity:0;animation:line 7.5s infinite}
.lines span:first-child{opacity:1}
.lines span:nth-child(2){animation-delay:2.5s}.lines span:nth-child(3){animation-delay:5s}
@keyframes line{0%{opacity:0;transform:translateY(6px)}5%,28%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-6px)}}
.reduced *, .reduced *::before{animation:none !important}

.beeC{offset-path:path("M195 82 C 280 80, 322 112, 322 150 C 322 190, 280 220, 195 218 C 110 220, 68 190, 68 150 C 68 112, 110 84, 195 82");offset-rotate:0deg;animation:fly 4.2s linear infinite}
@keyframes fly{from{offset-distance:0%}to{offset-distance:100%}}
.trail{stroke-dasharray:3 7;animation:trail 1s linear infinite}
@keyframes trail{to{stroke-dashoffset:-10}}
.pol{opacity:.25;animation:pol 4.2s infinite}
@keyframes pol{0%,8%{opacity:.25;r:3}12%{opacity:1;r:5}40%,100%{opacity:.25;r:3}}
.card{animation:card .5s 1.6s ease-out both}
@keyframes card{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.reduced .beeC{offset-distance:8%}
.face{transform-origin:center;animation:face 4.2s step-end infinite}
@keyframes face{0%{transform:scaleX(1)}25%{transform:scaleX(-1)}75%{transform:scaleX(1)}}

</style><style>*,*::before,*::after{animation:none!important;transition:none!important}</style><style type="text/css"></style></head>
<body>


<div class="ld" style="width:390px;height:844px;background:#F4F1EA;display:flex;flex-direction:column;align-items:center;font-family:'DM Sans', sans-serif;color:#1C2B24;position:relative;overflow:hidden">
<svg width="390" height="320" viewBox="0 0 390 320" aria-hidden="true" style="margin-top:150px;overflow:visible">
<path class="trail" d="M195 82 C 280 80, 322 112, 322 150 C 322 190, 280 220, 195 218 C 110 220, 68 190, 68 150 C 68 112, 110 84, 195 82" fill="none" stroke="#C9BFA8" stroke-width="2" stroke-linecap="round"></path>
<circle class="pol" cx="195" cy="82" r="3" fill="#F2C744" style="animation-delay:-0.5s"></circle>
<circle class="pol" cx="322" cy="150" r="3" fill="#F2C744" style="animation-delay:-3.65s"></circle>
<circle class="pol" cx="195" cy="218" r="3" fill="#F2C744" style="animation-delay:-2.6s"></circle>
<circle class="pol" cx="68" cy="150" r="3" fill="#F2C744" style="animation-delay:-1.55s"></circle>
<text x="195" y="164" text-anchor="middle" style="font-family:'Fraunces',serif;font-weight:600;font-size:40px;fill:#24463A">dygo</text>
<g class="beeC"><g class="face"><g transform="translate(-16 -17)"><g class="wings"><g class="wl"><ellipse cx="12" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(-25 12 9)"></ellipse></g><g class="wr"><ellipse cx="20" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(25 20 9)"></ellipse></g></g><ellipse cx="16" cy="19" rx="9" ry="7" fill="#F2C744"></ellipse><path d="M12 13.2 V24.8" stroke="#3B3020" stroke-width="2.4"></path><path d="M17 12.2 V25.8" stroke="#3B3020" stroke-width="2.4"></path><circle cx="23.5" cy="17.5" r="1.3" fill="#3B3020"></circle><path d="M7 19 L5 19" stroke="#3B3020" stroke-width="1.6" stroke-linecap="round"></path></g></g></g>
</svg>
<div class="lines" style="margin-top:-20px;font-size:15px;color:#5E6A62"><span>Pollinating your words…</span><span>Watering your garden…</span><span>Almost ready…</span></div>
<div class="card" style="position:absolute;left:24px;right:24px;bottom:56px;background:#FFFFFF;border:1px solid #E3DDD0;border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:6px">
<div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5E6A62">While you wait</div>
<div style="display:flex;align-items:baseline;gap:10px"><span style="font-family:'Fraunces',serif;font-weight:600;font-size:26px;color:#24463A">bloom</span><span style="font-size:15px;color:#5E6A62">/bluːm/ · verb</span></div>
<div style="font-size:15px;line-height:1.45;color:#1C2B24">to produce flowers; to grow and do well. “Her English bloomed in a year.”</div>
</div>
</div>




</body></html>
