<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Quiz · Listen and spell</title>

<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1EA;color:#1C2B24}
a{color:#B4552E}a:hover{color:#8A3E20}
@keyframes rise{0%{transform:translateY(8px);opacity:0}100%{transform:translateY(0);opacity:1}}
.rise{animation:rise .25s ease-out}
@keyframes bloom{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.bloom{animation:bloom .7s ease-out}
</style><style>*,*::before,*::after{animation:none!important;transition:none!important}</style><style type="text/css"></style></head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 24px; font-family: inherit; color: #1C2B24; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<a href="AdultTopicDetail.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3DDD0; display: flex; align-items: center; justify-content: center; color: #1C2B24; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6 L18 18"></path><path d="M18 6 L6 18"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px">
<div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #5E6A62"><span>Quiz · Environment</span><span>10/10</span></div>
<div style="position: relative; height: 10px; border-radius: 5px; background: #EAE5DA">
<div style="width: 90%; height: 10px; border-radius: 5px; background: #7FA487; transition: width .3s"></div>
<svg style="position: absolute; top: -9px; left: calc(90% - 11px)" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20 C4 18 3 10 6 4 C12 5 20 9 12 20 Z" fill="#3E7F5A"></path></svg>
</div>
</div>
</div>

<div class="rise" style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 26px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 #E8E1D2">
<span style="width: fit-content; font-size: 12px; font-weight: 700; background: #DDE7DA; color: #24463A; padding: 4px 10px; border-radius: 10px">Listen and spell</span>






<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0 2px">
<button aria-label="Play the word" style="width: 84px; height: 84px; border-radius: 42px; border: none; background: #24463A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 0 #142A21"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z"></path><path d="M16.5 8.5 C18 10 18 14 16.5 15.5"></path><path d="M19 6 C22 9 22 15 19 18"></path></svg></button>
<span style="font-size: 15px; color: #5E6A62; text-align: center">Listen, then type the word you hear.</span>
</div>




<button style="align-self: flex-start; min-height: 44px; border: none; background: none; padding: 0; font-family: inherit; font-size: 14px; font-weight: 600; color: #24463A; text-decoration: underline; text-underline-offset: 4px; cursor: pointer">Need a hint?</button>

</div>




<div style="display: flex; flex-direction: column; gap: 10px">
<div lang="en" aria-label="Type your answer…" style="height: 54px; box-sizing: border-box; border-radius: 16px; border: 1px solid #E3DDD0; background: #FFFFFF; padding: 0 16px; display: flex; align-items: center; font-size: 17px; color: #8A938C">Type your answer…<span style="display: none; width: 2px; height: 22px; background: #24463A; margin-left: 1px"></span></div>

<button style="height: 58px; border-radius: 18px; border: none; background: #24463A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: inherit; font-weight: 700; font-size: 17px; box-shadow: 0 4px 0 #142A21; cursor: pointer; width: 100%; opacity: 0.45">Check</button>

</div>



</div>
</div>




</body></html>
