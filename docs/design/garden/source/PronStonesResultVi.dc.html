<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Phát âm · Kết quả</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1EA;color:#1C2B24}
a{color:#B4552E}a:hover{color:#8A3E20}
@keyframes away{0%{transform:translate(0,0)}100%{transform:translate(150px,-50px)}}
.away{animation:away 2.4s ease-in infinite}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .6s ease-out}
@keyframes ring{0%{opacity:.9}100%{opacity:.2}}
.ring{animation:ring 1.2s ease-in-out infinite alternate}
.chip:focus-visible,.pill:focus-visible,.cta:focus-visible{outline:3px solid #E0B04A;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; display: flex; flex-direction: column; gap: 14px; padding: 20px 18px 26px; font-family: 'DM Sans', 'Be Vietnam Pro', sans-serif; color: #1C2B24; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px">
<a href="AdultTopicDetailVi.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3DDD0; display: flex; align-items: center; justify-content: center; color: #1C2B24; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6 L18 18"></path><path d="M18 6 L6 18"></path></svg></a>
<span style="flex-grow: 1; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #3E7F5A">Phát âm</span>
<span style="font-size: 13px; font-weight: 700; color: #5E6A62">{{beeCount}}</span>
</div>
<div class="{{popClass}}" style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
<span style="align-self: flex-start; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 10px; background: {{badgeBg}}; color: {{badgeFg}}">{{badge}}</span>
<span style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 32px; line-height: 1.1">{{headline}}</span>
<span style="font-size: 16px; line-height: 1.45; color: #44524A">{{sub}}</span>
</div>
<div style="border-radius: 26px; background: #24463A; overflow: hidden; display: flex; flex-direction: column">
<div style="position: relative">
<svg width="100%" viewBox="0 0 334 150" role="img" aria-label="{{stonesLabel}}" style="display: block; height: auto">
<path d="M0 110 Q 84 100 167 110 T 334 110 V150 H0 Z" fill="#1F3E33"></path><path d="M0 110 Q 84 100 167 110 T 334 110" fill="none" stroke="#3A5E4F" stroke-width="2"></path>
<sc-for list="{{stones}}" as="s" hint-placeholder-count="3"><sc-if value="{{s.sel}}" hint-placeholder-val="{{false}}"><ellipse class="ring" cx="{{s.cx}}" cy="{{s.cy}}" rx="{{s.ringRx}}" ry="{{s.ringRy}}" fill="none" stroke="#F2D28B" stroke-width="3"></ellipse></sc-if><g transform="{{s.tf}}"><ellipse cx="{{s.cx}}" cy="{{s.cy}}" rx="{{s.rx}}" ry="{{s.ry}}" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="2.5" stroke-dasharray="{{s.dash}}"></ellipse></g></sc-for>
<sc-if value="{{retry}}" hint-placeholder-val="{{true}}"><g transform="{{beeT}}"><g transform="translate(0,10) scale(1.6)"><g transform="translate(-16,-17)"><ellipse cx="12" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(-25 12 9)"></ellipse><ellipse cx="20" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(25 20 9)"></ellipse><ellipse cx="16" cy="19" rx="9" ry="7" fill="#F2C744"></ellipse><path d="M12 13.2 V24.8" stroke="#3B3020" stroke-width="2.4"></path><path d="M17 12.2 V25.8" stroke="#3B3020" stroke-width="2.4"></path><circle cx="23.5" cy="17.5" r="1.3" fill="#3B3020"></circle><path d="M7 19 L5 19" stroke="#3B3020" stroke-width="1.6" stroke-linecap="round"></path></g></g></g></sc-if>
<sc-if value="{{pass}}" hint-placeholder-val="{{false}}"><g class="away"><g transform="{{beeT}}"><g transform="translate(0,10) scale(1.6)"><g transform="translate(-16,-17)"><ellipse cx="12" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(-25 12 9)"></ellipse><ellipse cx="20" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(25 20 9)"></ellipse><ellipse cx="16" cy="19" rx="9" ry="7" fill="#F2C744"></ellipse><path d="M12 13.2 V24.8" stroke="#3B3020" stroke-width="2.4"></path><path d="M17 12.2 V25.8" stroke="#3B3020" stroke-width="2.4"></path><circle cx="23.5" cy="17.5" r="1.3" fill="#3B3020"></circle><path d="M7 19 L5 19" stroke="#3B3020" stroke-width="1.6" stroke-linecap="round"></path></g></g></g></g></sc-if>
</svg>
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none"><sc-for list="{{stones}}" as="s" hint-placeholder-count="3"><span lang="en" style="position: absolute; left: {{s.left}}; top: {{s.top}}; transform: {{s.lift}}; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: {{s.px}}; line-height: 1; color: #1C2B24; white-space: nowrap">{{s.text}}</span></sc-for></div>
</div>
<div style="display: grid; grid-template-columns: {{chipCols}}; gap: 6px; padding: 0 10px 12px">
<sc-for list="{{stones}}" as="s" hint-placeholder-count="3"><button class="chip" onClick="{{s.pick}}" aria-label="{{s.aria}}" aria-pressed="{{s.pressed}}" style="height: 52px; border-radius: 16px; border: 2px {{s.chipBorderStyle}} {{s.chipBorder}}; background: {{s.chipBg}}; color: {{s.chipFg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; font-family: 'DM Sans', 'Be Vietnam Pro', sans-serif; padding: 0 4px; min-width: 0"><span lang="en" style="display: flex; align-items: center; gap: 5px; font-weight: 700; font-size: 15px"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4 L20 12 L6 20 Z"></path></svg>{{s.text}}</span><span style="font-size: 11px; font-weight: 600; opacity: .85; white-space: nowrap">{{s.chipSub}}</span></button></sc-for>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 13px; font-weight: 700; color: #5E6A62; flex-shrink: 0; padding-left: 4px">Cả từ</span>
<button class="pill" aria-label="Nghe giọng bản xứ" style="flex: 1; height: 44px; border-radius: 22px; border: 1px solid #C9D8C4; background: #F1F6EF; color: #24463A; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'DM Sans', 'Be Vietnam Pro', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4 L20 12 L6 20 Z"></path></svg>Bản xứ <span style="font-weight: 600; color: #5E6A62">{{natDur}}</span></button>
<button class="pill" aria-label="Nghe bản ghi của bạn" style="flex: 1; height: 44px; border-radius: 22px; border: 1px solid #EBC7B6; background: #FBF1EC; color: #8A3E20; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'DM Sans', 'Be Vietnam Pro', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4 L20 12 L6 20 Z"></path></svg>Bạn <span style="font-weight: 600; color: #5E6A62">{{mineDur}}</span></button>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; align-items: stretch; gap: 4px">
<a class="cta" href="{{mainHref}}" style="height: 60px; border-radius: 20px; background: #B4552E; color: #FFFFFF; box-shadow: 0 4px 0 #7E3719; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 17px; text-decoration: none; padding: 0 16px">{{mainLabel}}<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{mainIcon}}"></path></svg></a>
<a href="{{secHref}}" style="align-self: center; display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; font-size: 15px; font-weight: 600; color: #5E6A62; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{secIcon}}"></path></svg>{{secLabel}}</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"result":{"editor":"enum","options":["pass","almostPerfect","retry"],"default":"pass","section":"Demo"},"word":{"editor":"enum","options":["mitigate","compensation","cloudy","sunny"],"default":"mitigate","section":"Demo"},"round":{"editor":"enum","options":["next","last"],"default":"next","section":"Demo"}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: null }; }
  renderVals() {
    const r = this.props.result ?? 'pass', w = this.props.word ?? 'mitigate', round = this.props.round ?? 'next';
    const WORDS = {
      mitigate: { syl: [['MI', 1], ['ti', 0], ['gate', 0]], wob: 1, heard: '/taɪ/', target: '/tɪ/', nat: '0.8s', mine: '1.0s' },
      compensation: { syl: [['com', 0], ['pen', 0], ['SA', 1], ['tion', 0]], wob: 2, heard: '/sæ/', target: '/seɪ/', nat: '1.1s', mine: '1.3s' },
      cloudy: { syl: [['CLOU', 1], ['dy', 0]], wob: 1, heard: null, target: '/di/', nat: '0.6s', mine: '0.4s' },
      sunny: { syl: [['SUN', 1], ['ny', 0]], wob: 1, heard: '/naɪ/', target: '/ni/', nat: '0.6s', mine: '0.8s' }
    };
    const d = WORDS[w], n = d.syl.length;
    const retry = r === 'retry', close = r === 'almostPerfect', pass = !retry, last = round === 'last';
    const weak = d.syl[d.wob][0];
    const sel = this.state.sel ?? (pass && !close ? -1 : d.wob);
    const slot = 334 / n;
    const stones = d.syl.map((s, i) => {
      const big = s[1] === 1, bad = retry && i === d.wob, near = close && i === d.wob, cx = +(slot * (i + .5)).toFixed(1);
      const rx = +Math.min(big ? 52 : 36, slot / 2 - (big ? 4 : 14)).toFixed(1), ry = big ? 22 : 15, cy = big ? 100 : 104;
      const on = sel === i;
      return { text: s[0], cx, cy, rx, ry, ty: cy + (big ? 8 : 6), fs: big ? 22 : 16,
        ringRx: rx + 7, ringRy: ry + 6, sel: on,
        left: (cx / 334 * 100).toFixed(2) + '%', top: (cy / 150 * 100).toFixed(2) + '%', px: (big ? 23 : 17) + 'px', lift: bad ? 'translate(-50%, -50%) rotate(-8deg)' : 'translate(-50%, -50%)',
        fill: bad ? '#E8A87C' : near ? '#C8DDB8' : '#9CC39A', stroke: near ? '#E0B04A' : 'none', dash: near ? '5 4' : 'none',
        tf: bad ? 'rotate(-8 ' + cx + ' ' + cy + ')' : 'rotate(0)',
        pressed: on ? 'true' : 'false',
        aria: 'Nghe ' + s[0] + ': bản xứ, rồi đến bạn',
        chipBg: on ? '#F4F1EA' : bad ? '#FBEFE9' : near ? '#FBF4E4' : '#2E5446',
        chipFg: on ? '#1C2B24' : bad ? '#8A3E20' : near ? '#6B5215' : '#DDE7DA',
        chipBorder: on ? '#F2D28B' : bad ? '#E8A87C' : near ? '#E0B04A' : '#3A5E4F',
        chipBorderStyle: near && !on ? 'dashed' : 'solid',
        chipSub: on ? 'Bản xứ → bạn' : bad ? 'Chênh vênh' : near ? 'Gần đúng' : 'Chuẩn',
        pick: () => this.setState({ sel: i }) };
    });
    const heardLine = d.heard ? weak + ' nghe giống ' + d.heard + '.' : weak + ' bị ngắn quá.';
    const v = {
      pass: { badge: 'Đã thụ phấn · ' + n + '/' + n + ' hòn đá', headline: 'Qua suối gọn gàng!', sub: w + ' đã được thụ phấn. Chạm vào hòn đá để nghe lại.', badgeBg: '#DDE7DA', badgeFg: '#24463A' },
      almostPerfect: { badge: 'Đã thụ phấn · ' + n + '/' + n + ' hòn đá', headline: 'Qua suối rồi!', sub: 'Lần này vẫn tính. ' + weak + ' gần đúng: hãy đọc ' + d.target + '. Chạm ' + weak + ' để so sánh.', badgeBg: '#DDE7DA', badgeFg: '#24463A' },
      retry: { badge: 'Gần được · ' + (n - 1) + '/' + n + ' hòn đá', headline: 'Một hòn đá còn chênh vênh', sub: heardLine + ' Hãy đọc ' + d.target + '. Chạm ' + weak + ' để so sánh.', badgeBg: '#FBF4E4', badgeFg: '#6B5215' }
    }[r];
    const ARROW = 'M5 12 H19 M13 6 L19 12 L13 18', MIC = 'M12 3 a3 3 0 0 1 3 3 v5 a3 3 0 0 1 -6 0 v-5 a3 3 0 0 1 3 -3 M6 11 a6 6 0 0 0 12 0 M12 17 V21', BED = 'M4 20 V9 L12 4 L20 9 V20', SKIP = 'M5 6 L13 12 L5 18 Z M15 6 V18';
    let main, sec;
    if (retry) { main = ['Thử lại', 'PronStonesRecordVi.dc.html', MIC]; sec = last ? ['Về luống', 'AdultTopicDetailVi.dc.html', BED] : ['Bỏ qua, sang ong tiếp theo', 'PronStonesVi.dc.html', SKIP]; }
    else if (last) { main = ['Về luống', 'AdultTopicDetailVi.dc.html', ARROW]; sec = [close ? 'Luyện thêm ' + weak + ': đọc lại' : 'Đọc lại', 'PronStonesRecordVi.dc.html', MIC]; }
    else { main = ['Ong tiếp theo: deforestation', 'PronStonesVi.dc.html', ARROW]; sec = [close ? 'Luyện thêm ' + weak + ': đọc lại' : 'Đọc lại', 'PronStonesRecordVi.dc.html', MIC]; }
    return { ...v, retry, pass, stones, chipCols: 'repeat(' + n + ', minmax(0, 1fr))',
      beeCount: 'Ong 1/' + (last ? 1 : 3), popClass: pass ? 'pop' : '',
      beeT: 'translate(' + (pass ? 167 : stones[0].cx) + ',22)',
      stonesLabel: retry ? weak + ' còn chênh vênh, các hòn khác xanh' : close ? 'Các hòn đá đều xanh, ' + weak + ' gần đúng' : 'Cả ' + n + ' hòn đá đều xanh',
      natDur: d.nat, mineDur: pass && !close ? d.nat : d.mine,
      mainLabel: main[0], mainHref: main[1], mainIcon: main[2], secLabel: sec[0], secHref: sec[1], secIcon: sec[2] };
  }
}
</script>
</body>
</html>
