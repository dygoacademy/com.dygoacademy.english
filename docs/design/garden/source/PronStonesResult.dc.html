<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pronunciation · Result</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=DM+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1EA;color:#1C2B24}
a{color:#B4552E}a:hover{color:#8A3E20}
@keyframes away{0%{transform:translate(0,0)}100%{transform:translate(150px,-40px)}}
.away{animation:away 2.4s ease-in infinite}
@keyframes hov{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hov{animation:hov 1.6s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .6s ease-out}
@keyframes ring{0%{opacity:1}100%{opacity:.35}}
.ring{animation:ring 1.1s ease-in-out infinite alternate}
.cell:focus-visible,.pill:focus-visible,.cta:focus-visible{outline:3px solid #E0B04A;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; display: flex; flex-direction: column; gap: 14px; padding: 20px 18px 24px; font-family: 'DM Sans', sans-serif; color: #1C2B24; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px">
<a href="AdultTopicDetail.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3DDD0; display: flex; align-items: center; justify-content: center; color: #1C2B24; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6 L18 18"></path><path d="M18 6 L6 18"></path></svg></a>
<span style="flex-grow: 1; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #3E7F5A">Pronunciation</span>
<span style="font-size: 13px; font-weight: 700; color: #5E6A62">{{beeCount}}</span>
</div>
<div class="{{popClass}}" style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
<span style="align-self: flex-start; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 10px; background: {{badgeBg}}; color: {{badgeFg}}">{{badge}}</span>
<span style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; line-height: 1.1">{{headline}}</span>
<span style="font-size: 15px; line-height: 1.4; color: #44524A">{{sub}}</span>
</div>
<div style="border-radius: 26px; background: #24463A; overflow: hidden; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px 0">
<span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #DDE7DA">Fill each cell</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #F2D28B"><svg width="22" height="4" viewBox="0 0 22 4" aria-hidden="true"><path d="M0 2 H22" stroke="#F2D28B" stroke-width="2" stroke-dasharray="4 3"></path></svg>Pass line 80%</span>
</div>
<div style="position: relative">
<svg width="100%" viewBox="0 0 334 150" role="img" aria-label="{{combLabel}}" style="display: block; height: auto">
<defs><sc-for list="{{cells}}" as="c" hint-placeholder-count="3"><clipPath id="{{c.clipId}}"><polygon points="{{c.pts}}"></polygon></clipPath></sc-for></defs>
<sc-for list="{{cells}}" as="c" hint-placeholder-count="3"><polygon points="{{c.pts}}" fill="#FBF7EC"></polygon><g clip-path="{{c.clipUrl}}"><rect x="{{c.hx}}" y="{{c.honeyY}}" width="{{c.hw}}" height="{{c.honeyH}}" fill="{{c.honey}}"></rect><path d="{{c.wave}}" fill="{{c.honey}}"></path></g><sc-if value="{{c.sel}}" hint-placeholder-val="{{false}}"><polygon class="ring" points="{{c.ringPts}}" fill="none" stroke="#F2D28B" stroke-width="3.5" stroke-linejoin="round"></polygon></sc-if><polygon points="{{c.pts}}" fill="none" stroke="{{c.edge}}" stroke-width="2.5" stroke-dasharray="{{c.dash}}" stroke-linejoin="round"></polygon></sc-for>
<path d="M0 68 H334" stroke="#F2D28B" stroke-width="2" stroke-dasharray="5 4" opacity=".95"></path>
<sc-if value="{{beeStay}}" hint-placeholder-val="{{true}}"><g transform="{{beeT}}"><g class="hov"><g transform="scale(1.15)"><g transform="translate(-16,-17)"><ellipse cx="12" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(-25 12 9)"></ellipse><ellipse cx="20" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(25 20 9)"></ellipse><ellipse cx="16" cy="19" rx="9" ry="7" fill="#F2C744"></ellipse><path d="M12 13.2 V24.8" stroke="#3B3020" stroke-width="2.4"></path><path d="M17 12.2 V25.8" stroke="#3B3020" stroke-width="2.4"></path><circle cx="23.5" cy="17.5" r="1.3" fill="#3B3020"></circle></g></g></g></g></sc-if>
<sc-if value="{{beeAway}}" hint-placeholder-val="{{false}}"><g class="away"><g transform="{{beeT}}"><g transform="scale(1.15)"><g transform="translate(-16,-17)"><ellipse cx="12" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(-25 12 9)"></ellipse><ellipse cx="20" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(25 20 9)"></ellipse><ellipse cx="16" cy="19" rx="9" ry="7" fill="#F2C744"></ellipse><path d="M12 13.2 V24.8" stroke="#3B3020" stroke-width="2.4"></path><path d="M17 12.2 V25.8" stroke="#3B3020" stroke-width="2.4"></path><circle cx="23.5" cy="17.5" r="1.3" fill="#3B3020"></circle></g></g></g></g></sc-if>
</svg>
<div style="position: absolute; inset: 0">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="3"><button class="cell" onClick="{{c.pick}}" aria-label="{{c.aria}}" aria-pressed="{{c.pressed}}" style="position: absolute; left: {{c.left}}; top: {{c.top}}; width: {{c.bw}}; height: {{c.bh}}; transform: translate(-50%, -50%); background: transparent; border: none; border-radius: 30px; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: 'DM Sans', sans-serif; color: #1C2B24"><span lang="en" style="font-weight: 800; font-size: {{c.px}}; line-height: 1">{{c.text}}</span><span style="font-size: 13px; font-weight: 800; line-height: 1">{{c.pctLabel}}</span><span aria-hidden="true" style="position: absolute; top: 2px; right: 0; width: 20px; height: 20px; border-radius: 10px; background: {{c.markBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #24463A"><sc-if value="{{c.ok}}" hint-placeholder-val="{{true}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17.5 L19 7"></path></svg></sc-if><sc-if value="{{c.bad}}" hint-placeholder-val="{{false}}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="M6 6 L18 18"></path><path d="M18 6 L6 18"></path></svg></sc-if></span></button></sc-for>
</div>
</div>
<div aria-live="polite" style="margin: 0 12px 12px; padding: 10px 12px; border-radius: 14px; background: #1F3E33; display: flex; align-items: center; gap: 10px">
<span style="flex-shrink: 0; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px; border-radius: 8px; background: {{detailBg}}; color: #1C2B24">{{detailTag}}</span>
<span style="font-size: 13px; line-height: 1.35; color: #DDE7DA">{{detailText}}</span>
</div>
</div>
<div style="border-radius: 22px; background: #FFFFFF; border: 1px solid #E3DDD0; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="100%" viewBox="0 0 330 70" role="img" aria-label="{{waveLabel}}" style="display: block; height: auto; flex: 1; min-width: 0">
<sc-if value="{{showZone}}" hint-placeholder-val="{{true}}"><rect x="{{zoneX}}" y="2" width="{{zoneW}}" height="66" rx="8" fill="#FBEFE9"></rect><text x="{{zoneMid}}" y="13" text-anchor="middle" font-family="DM Sans" font-weight="800" font-size="10" fill="#8A3E20">{{weak}}</text></sc-if>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="12"><rect x="{{b.x}}" y="{{b.ny}}" width="4" height="{{b.nh}}" rx="2" fill="#3E7F5A"></rect><rect x="{{b.x}}" y="36" width="4" height="{{b.mh}}" rx="2" fill="#B4552E"></rect></sc-for>
<path d="M0 35 H330" stroke="#E3DDD0" stroke-width="1"></path>
</svg>
<svg width="54" height="54" viewBox="0 0 56 56" role="img" aria-label="{{ringLabel}}" style="flex-shrink: 0"><circle cx="28" cy="28" r="23" fill="none" stroke="#EDE8DC" stroke-width="6"></circle><circle cx="28" cy="28" r="23" fill="none" stroke="{{ringColor}}" stroke-width="6" stroke-linecap="round" stroke-dasharray="{{ringDash}}" transform="rotate(-90 28 28)"></circle><text x="28" y="33" text-anchor="middle" font-family="DM Sans" font-weight="800" font-size="15" fill="#1C2B24">{{overall}}%</text></svg>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<button class="pill" onClick="{{playNat}}" aria-pressed="{{natPressed}}" aria-label="{{natAria}}" style="height: 60px; border-radius: 16px; border: 1px solid #C9D8C4; background: {{natBg}}; color: {{natFg}}; display: flex; align-items: center; gap: 10px; padding: 0 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; text-align: left; min-width: 0"><span style="width: 36px; height: 36px; border-radius: 18px; background: #24463A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4 L20 12 L7 20 Z"></path></svg></span><span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 700; font-size: 15px">Native</span></span></button>
<button class="pill" onClick="{{playMine}}" aria-pressed="{{minePressed}}" aria-label="{{mineAria}}" style="height: 60px; border-radius: 16px; border: 1px solid #EBC7B6; background: {{mineBg}}; color: {{mineFg}}; display: flex; align-items: center; gap: 10px; padding: 0 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; text-align: left; min-width: 0"><span style="width: 36px; height: 36px; border-radius: 18px; background: #B4552E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4 L20 12 L7 20 Z"></path></svg></span><span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 700; font-size: 15px">Your try</span></span></button>
</div>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; align-items: stretch; gap: 2px">
<a class="cta" href="{{mainHref}}" style="height: 58px; border-radius: 20px; background: #B4552E; color: #FFFFFF; box-shadow: 0 4px 0 #7E3719; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 17px; text-decoration: none; padding: 0 16px">{{mainLabel}}<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{mainIcon}}"></path></svg></a>
<a href="{{secHref}}" style="align-self: center; display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; font-size: 15px; font-weight: 600; color: #5E6A62; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{secIcon}}"></path></svg>{{secLabel}}</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"result":{"editor":"enum","options":["pass","almostPerfect","retry"],"default":"retry","section":"Demo"},"word":{"editor":"enum","options":["mitigate","compensation","cloudy","sunny"],"default":"mitigate","section":"Demo"},"round":{"editor":"enum","options":["next","last"],"default":"next","section":"Demo"}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: null, play: null }; }
  renderVals() {
    const r = this.props.result ?? 'retry', w = this.props.word ?? 'mitigate', round = this.props.round ?? 'next';
    const WORDS = {
      mitigate: { syl: [['MI', 1], ['ti', 0], ['gate', 0]], wob: 1, heard: '/taɪ/', target: '/tɪ/', nat: '0.8s', mine: '1.0s', pct: [95, 91, 94] },
      compensation: { syl: [['com', 0], ['pen', 0], ['SA', 1], ['tion', 0]], wob: 2, heard: '/sæ/', target: '/seɪ/', nat: '1.1s', mine: '1.3s', pct: [93, 90, 92, 95] },
      cloudy: { syl: [['CLOU', 1], ['dy', 0]], wob: 1, heard: null, target: '/di/', nat: '0.6s', mine: '0.4s', pct: [96, 93] },
      sunny: { syl: [['SUN', 1], ['ny', 0]], wob: 1, heard: '/naɪ/', target: '/ni/', nat: '0.6s', mine: '0.8s', pct: [94, 92] }
    };
    const d = WORDS[w], n = d.syl.length;
    const retry = r === 'retry', close = r === 'almostPerfect', pass = !retry, last = round === 'last';
    const weak = d.syl[d.wob][0];
    const PCT = d.pct.slice();
    if (retry) PCT[d.wob] = d.heard ? 56 : 41; else if (close) PCT[d.wob] = 82;
    const overall = Math.round(PCT.reduce((a, b) => a + b, 0) / n);
    const sel = this.state.sel ?? (pass && !close ? -1 : d.wob);
    const slot = 334 / n, R = 40, CY = 100, HW = R * Math.sqrt(3) / 2;
    const hex = (cx, cy, rr) => [-90, -30, 30, 90, 150, 210].map(a => { const t = a * Math.PI / 180; return (cx + rr * Math.cos(t)).toFixed(1) + ',' + (cy + rr * Math.sin(t)).toFixed(1); }).join(' ');
    const cells = d.syl.map((s, i) => {
      const cx = +(slot * (i + .5)).toFixed(1), p = PCT[i], bad = retry && i === d.wob, near = close && i === d.wob, on = sel === i;
      const fillH = 2 * R * p / 100, top = CY + R - fillH;
      let wave = 'M' + (cx - HW) + ' ' + (top + 1);
      for (let k = 0; k <= 8; k++) { const x = cx - HW + (2 * HW) * k / 8; wave += ' L' + x.toFixed(1) + ' ' + (top + (k % 2 ? -2.5 : 1.5)).toFixed(1); }
      wave += ' L' + (cx + HW) + ' ' + (top + 2) + ' Z';
      return { text: s[0], px: (s[1] ? 19 : 16) + 'px', pctLabel: p + '%', clipId: 'hive' + i, clipUrl: 'url(#hive' + i + ')',
        pts: hex(cx, CY, R), ringPts: hex(cx, CY, R + 6), hx: cx - HW, hw: 2 * HW, honeyY: top.toFixed(1), honeyH: fillH.toFixed(1), wave,
        honey: bad ? '#E8A87C' : '#F2C744', edge: near ? '#E0B04A' : '#3A5E4F', dash: near ? '5 4' : 'none', sel: on,
        ok: !bad, bad, markBg: bad ? '#B4552E' : near ? '#8A6A12' : '#3E7F5A',
        left: (cx / 334 * 100).toFixed(2) + '%', top: (CY / 150 * 100).toFixed(2) + '%', bw: (2 * HW / 334 * 100).toFixed(2) + '%', bh: (2 * R / 150 * 100).toFixed(2) + '%',
        pressed: on ? 'true' : 'false',
        aria: s[0] + ': ' + p + '% match with native, ' + (bad ? 'below the pass line' : near ? 'just over the pass line' : 'pass') + '. Show details',
        pick: () => this.setState({ sel: i }), cx };
    });
    let det;
    if (sel < 0) det = ['All pass', '#9CC39A', 'Every cell filled past the 80% line. Tap one to see its score.'];
    else {
      const sy = d.syl[sel][0], p = PCT[sel], isBad = retry && sel === d.wob, isNear = close && sel === d.wob;
      det = isBad ? ['Not yet', '#E8A87C', sy + ': ' + p + '% match. ' + (d.heard ? 'Sounded like ' + d.heard + ', aim for ' : 'Cut short, aim for ') + d.target + '.']
        : isNear ? ['Close', '#F2D28B', sy + ': ' + p + '% match. Just past the line, aim for ' + d.target + '.']
        : ['Pass', '#9CC39A', sy + ': ' + p + '% match with native.'];
    }
    // mirror waveform: native above the line, the learner below
    const N = 40, bars = [], zs = Math.floor(d.wob / n * N), ze = Math.floor((d.wob + 1) / n * N);
    for (let i = 0; i < N; i++) {
      const seg = Math.min(n - 1, Math.floor(i / N * n)), local = (i / N * n) - seg;
      const env = Math.sin(Math.PI * Math.min(.98, Math.max(.06, local))) * (d.syl[seg][1] ? 1 : .72);
      const nh = 5 + 26 * env * (.7 + .3 * Math.abs(Math.sin(i * 1.7)));
      const inZone = i >= zs && i < ze, dev = inZone ? (100 - PCT[d.wob]) / 100 : .04;
      const mh = Math.max(3, nh * (1 + dev * (i % 2 ? 1.1 : -0.9)));
      bars.push({ x: (2 + i * 8.2).toFixed(1), ny: (34 - nh).toFixed(1), nh: nh.toFixed(1), mh: Math.min(32, mh).toFixed(1) });
    }
    const showZone = retry || close;
    const v = {
      pass: { badge: 'Hive full · ' + n + ' of ' + n + ' cells', headline: 'Sweet as honey!', sub: w + ' is pollinated.', badgeBg: '#DDE7DA', badgeFg: '#24463A' },
      almostPerfect: { badge: 'Hive full · ' + n + ' of ' + n + ' cells', headline: 'Nearly perfect!', sub: 'It counts! ' + w + ' is pollinated.', badgeBg: '#DDE7DA', badgeFg: '#24463A' },
      retry: { badge: 'Almost · ' + (n - 1) + ' of ' + n + ' cells', headline: 'One cell needs honey', sub: 'Say it once more to pollinate ' + w + '.', badgeBg: '#FBF4E4', badgeFg: '#6B5215' }
    }[r];
    const ARROW = 'M5 12 H19 M13 6 L19 12 L13 18', MIC = 'M12 3 a3 3 0 0 1 3 3 v5 a3 3 0 0 1 -6 0 v-5 a3 3 0 0 1 3 -3 M6 11 a6 6 0 0 0 12 0 M12 17 V21', BED = 'M4 20 V9 L12 4 L20 9 V20', SKIP = 'M5 6 L13 12 L5 18 Z M15 6 V18';
    let main, sec;
    if (retry) { main = ['Try again', 'PronStonesRecord.dc.html', MIC]; sec = last ? ['Back to the bed', 'AdultTopicDetail.dc.html', BED] : ['Skip to next bee', 'PronStones.dc.html', SKIP]; }
    else if (last) { main = ['Back to the bed', 'AdultTopicDetail.dc.html', ARROW]; sec = [close ? 'Polish ' + weak + ': say it again' : 'Say it again', 'PronStonesRecord.dc.html', MIC]; }
    else { main = ['Next bee: deforestation', 'PronStones.dc.html', ARROW]; sec = [close ? 'Polish ' + weak + ': say it again' : 'Say it again', 'PronStonesRecord.dc.html', MIC]; }
    const pl = this.state.play, mine = pass && !close ? d.nat : d.mine, C = 2 * Math.PI * 23;
    const tog = k => () => this.setState({ play: this.state.play === k ? null : k });
    const beeCell = sel < 0 ? null : cells[sel];
    return { ...v, cells, bars, word: w, weak, overall, showZone,
      zoneX: (zs * 8.2).toFixed(1), zoneW: ((ze - zs) * 8.2).toFixed(1), zoneMid: (((zs + ze) / 2) * 8.2).toFixed(1),
      ringDash: (C * overall / 100).toFixed(1) + ' ' + C.toFixed(1), ringColor: retry ? '#E0A030' : '#3E7F5A', ringLabel: 'Whole word: ' + overall + '% match with native',
      waveLabel: retry || close ? 'Your sound shape matches the native one except around ' + weak : 'Your sound shape mirrors the native one',
      combLabel: retry ? weak + ' is below the pass line, the other cells are full' : 'All ' + n + ' cells filled past the pass line',
      beeStay: !!beeCell, beeAway: !beeCell, beeT: 'translate(' + (beeCell ? beeCell.cx : 167) + ',34)',
      beeCount: 'Bee 1 of ' + (last ? 1 : 3), popClass: pass ? 'pop' : '',
      detailTag: det[0], detailBg: det[1], detailText: det[2],
      playNat: tog('nat'), playMine: tog('mine'),
      natPressed: pl === 'nat' ? 'true' : 'false', minePressed: pl === 'mine' ? 'true' : 'false',
      natBg: pl === 'nat' ? '#DCEAD6' : '#F1F6EF', natFg: '#24463A', natSub: '#4E5A52',
      mineBg: pl === 'mine' ? '#F6DED2' : '#FBF1EC', mineFg: '#8A3E20', mineSub: '#6E4A3A',
      natAria: 'Play the native speaker saying ' + w + ', ' + d.nat, mineAria: 'Play your recording of ' + w + ', ' + mine,
      mainLabel: main[0], mainHref: main[1], mainIcon: main[2], secLabel: sec[0], secHref: sec[1], secIcon: sec[2] };
  }
}
</script>
</body>
</html>
