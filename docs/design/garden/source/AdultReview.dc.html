<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watering Review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1EA;color:#1C2B24}
a{color:#B4552E}a:hover{color:#8A3E20}
@keyframes rise{0%{transform:translateY(8px);opacity:0}100%{transform:translateY(0);opacity:1}}
.rise{animation:rise .25s ease-out}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 24px; font-family: 'DM Sans', sans-serif; color: #1C2B24; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<a href="AdultHome.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3DDD0; display: flex; align-items: center; justify-content: center; color: #1C2B24; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6 L18 18"></path><path d="M18 6 L6 18"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px">
<div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #5E6A62"><span>Mission · Water 18 words</span><span>{{done}}/18</span></div>
<div style="position: relative; height: 10px; border-radius: 5px; background: #EAE5DA">
<div style="width: {{pct}}; height: 10px; border-radius: 5px; background: #7FA487; transition: width .3s"></div>
<svg style="position: absolute; top: -9px; left: {{leafPos}}" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20 C4 18 3 10 6 4 C12 5 20 9 12 20 Z" fill="#3E7F5A"></path></svg>
</div>
</div>
</div>

<sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
<div class="rise" style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px">
<div style="flex-grow: 1; background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 26px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 #E8E1D2">
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="font-size: 12px; font-weight: 700; background: #DDE7DA; color: #24463A; padding: 4px 10px; border-radius: 10px">{{card.level}}</span>
<span style="font-size: 12px; font-weight: 600; background: #F4F1EA; color: #5E6A62; padding: 4px 10px; border-radius: 10px">{{card.topic}}</span>
<span style="font-size: 12px; font-weight: 600; background: #F4F1EA; color: #5E6A62; padding: 4px 10px; border-radius: 10px">{{card.pos}}</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<div style="display: flex; flex-direction: column">
<span style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 40px; line-height: 1.05">{{card.word}}</span>
<span style="font-size: 16px; color: #5E6A62">{{card.ipa}}</span>
</div>
<button aria-label="Play pronunciation" style="width: 52px; height: 52px; border-radius: 26px; border: none; background: #24463A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z"></path><path d="M16.5 8.5 C18 10 18 14 16.5 15.5"></path><path d="M19 6 C22 9 22 15 19 18"></path></svg>
</button>
</div>

<sc-if value="{{hidden}}" hint-placeholder-val="{{true}}">
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #5E6A62; text-align: center">
<svg width="72" height="72" viewBox="0 0 60 60" aria-hidden="true"><ellipse cx="30" cy="52" rx="20" ry="5" fill="#E3DDD0"></ellipse><path d="M30 50 V32" stroke="#7FA487" stroke-width="3" stroke-linecap="round"></path><path d="M30 38 C22 37 17 31 19 26 C26 26 30 31 30 38 Z" fill="#9CC39A"></path><path d="M30 35 C38 34 43 28 41 23 C34 23 30 28 30 35 Z" fill="#B7D6AE"></path><path d="M44 10 C44 10 39 17 39 20 A5 5 0 0 0 49 20 C49 17 44 10 44 10 Z" fill="#8EC5E8"></path></svg>
<span style="font-size: 15px">Say the meaning out loud,<br>then check.</span>
</div>
</sc-if>

<sc-if value="{{shown}}" hint-placeholder-val="{{false}}">
<div class="rise" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 600; line-height: 1.35">{{card.meaning}}</span>
<span style="font-size: 15px; color: #5E6A62">{{card.vi}}</span>
</div>
<div style="border-left: 0; background: #F7F4EC; border-radius: 14px; padding: 12px 14px; font-family: 'Fraunces', serif; font-size: 16px; line-height: 1.45; color: #2E3A33">“{{card.example}}”</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5E6A62">Collocations</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{card.collocations}}" as="c" hint-placeholder-count="3">
<span style="font-size: 14px; font-weight: 600; border: 1px solid #C9D8C4; color: #24463A; padding: 6px 12px; border-radius: 16px">{{c}}</span>
</sc-for>
</div>
</div>
</div>
</sc-if>
</div>

<sc-if value="{{hidden}}" hint-placeholder-val="{{true}}">
<button onClick="{{show}}" style="height: 60px; border-radius: 18px; border: none; background: #24463A; color: #FFFFFF; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 17px; cursor: pointer; box-shadow: 0 4px 0 #142A21">Show answer</button>
</sc-if>

<sc-if value="{{shown}}" hint-placeholder-val="{{false}}">
<div class="rise" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button onClick="{{rate}}" style="height: 68px; border-radius: 16px; border: none; background: #F6E3DC; color: #8A3E20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-family: 'DM Sans', sans-serif"><span style="font-weight: 700; font-size: 15px">Again</span><span style="font-size: 12px">&lt; 1 min</span></button>
<button onClick="{{rate}}" style="height: 68px; border-radius: 16px; border: none; background: #F3EBD6; color: #6B4E0E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-family: 'DM Sans', sans-serif"><span style="font-weight: 700; font-size: 15px">Hard</span><span style="font-size: 12px">2 days</span></button>
<button onClick="{{rate}}" style="height: 68px; border-radius: 16px; border: none; background: #DDE7DA; color: #24463A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-family: 'DM Sans', sans-serif"><span style="font-weight: 700; font-size: 15px">Good</span><span style="font-size: 12px">5 days</span></button>
<button onClick="{{rate}}" style="height: 68px; border-radius: 16px; border: none; background: #24463A; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-family: 'DM Sans', sans-serif"><span style="font-weight: 700; font-size: 15px">Easy</span><span style="font-size: 12px">12 days</span></button>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{finished}}" hint-placeholder-val="{{false}}">
<div class="rise" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center">
<svg width="120" height="120" viewBox="0 0 60 60" aria-hidden="true"><ellipse cx="30" cy="54" rx="20" ry="4" fill="#E3DDD0"></ellipse><path d="M30 52 V26" stroke="#7FA487" stroke-width="3" stroke-linecap="round"></path><path d="M30 44 C23 43 19 38 21 34 C27 34 30 38 30 44 Z" fill="#9CC39A"></path><circle cx="30" cy="14" r="6" fill="#E8A87C"></circle><circle cx="38" cy="20" r="6" fill="#E8A87C"></circle><circle cx="35" cy="29" r="6" fill="#E8A87C"></circle><circle cx="25" cy="29" r="6" fill="#E8A87C"></circle><circle cx="22" cy="20" r="6" fill="#E8A87C"></circle><circle cx="30" cy="22" r="5" fill="#F2D28B"></circle></svg>
<span style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px">All 18 watered</span>
<a href="AdultBloom.dc.html" style="width: 100%; height: 58px; border-radius: 18px; background: #B4552E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; text-decoration: none; box-shadow: 0 4px 0 #7E3719">See your garden bloom</a>
<button onClick="{{restart}}" style="height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #E3DDD0; background: #FFFFFF; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px; color: #5E6A62; cursor: pointer">Replay demo</button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, shown: false };
  }
  renderVals() {
    const cards = [
      { word: 'mitigate', ipa: '/ˈmɪt.ɪ.ɡeɪt/', pos: 'verb', level: 'B2', topic: 'Environment',
        meaning: 'to make something bad less harmful or serious', vi: 'giảm nhẹ, làm dịu bớt',
        example: 'Planting more trees can help mitigate the effects of climate change.',
        collocations: ['mitigate the impact', 'mitigate risk', 'help to mitigate'] },
      { word: 'sustainable', ipa: '/səˈsteɪ.nə.bəl/', pos: 'adjective', level: 'B2', topic: 'Environment',
        meaning: 'able to continue for a long time without harming the environment', vi: 'bền vững',
        example: 'Cities need more sustainable forms of public transport.',
        collocations: ['sustainable development', 'sustainable growth', 'environmentally sustainable'] },
      { word: 'deteriorate', ipa: '/dɪˈtɪə.ri.ə.reɪt/', pos: 'verb', level: 'C1', topic: 'Health',
        meaning: 'to become worse over time', vi: 'xấu đi, suy giảm',
        example: 'Air quality has deteriorated sharply in many large cities.',
        collocations: ['deteriorate rapidly', 'health deteriorates', 'continue to deteriorate'] }
    ];
    const s = this.state;
    const finished = s.i >= cards.length;
    const card = cards[Math.min(s.i, cards.length - 1)];
    const done = 15 + s.i;
    const frac = done / 18;
    return {
      card,
      done,
      pct: Math.round(frac * 100) + '%',
      leafPos: 'calc(' + Math.round(frac * 100) + '% - 11px)',
      playing: !finished,
      finished,
      shown: s.shown,
      hidden: !s.shown,
      show: () => this.setState({ shown: true }),
      rate: () => this.setState({ i: s.i + 1, shown: false }),
      restart: () => this.setState({ i: 0, shown: false })
    };
  }
}
</script>
</body>
</html>
