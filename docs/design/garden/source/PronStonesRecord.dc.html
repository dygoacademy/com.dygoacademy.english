a{color:#B4552E}a:hover{color:#8A3E20}
@keyframes lvl{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.lvl{transform-box:fill-box;transform-origin:center;animation:lvl .7s ease-in-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.5);opacity:0}}
.ring{animation:ring 1.4s ease-out infinite}
@keyframes timer{0%{stroke-dashoffset:0}100%{stroke-dashoffset:289}}
.timer{animation:timer 4s linear infinite}
@keyframes splash{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.6);opacity:0}}
.splash{transform-box:fill-box;transform-origin:center;animation:splash 1.2s ease-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hop{animation:hop .6s ease-in-out infinite}
@keyframes hfill{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.hfill1,.hfill2,.hfill3,.hbub{transform-box:fill-box;transform-origin:50% 100%}
.hfill1{animation:hfill 1.4s ease-in-out infinite}.hfill2{animation:hfill 1.4s ease-in-out .25s infinite}.hfill3{animation:hfill 1.4s ease-in-out .5s infinite}
@keyframes hbub{0%,100%{transform:scaleY(.82)}50%{transform:scaleY(1)}}

@keyframes hhov{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

@keyframes vh{0%,100%{opacity:.12}45%{opacity:1}}

.quiet .vh{animation:none;opacity:.12}
@keyframes recdot{0%,100%{opacity:1}50%{opacity:.25}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"moment":{"editor":"enum","options":["beep","MI","ti","gate"],"default":"MI","section":"Demo"}}'>
class Component extends DCLogic {
  comb(mode, k) {
    const SYL = [['MI', 1], ['ti', 0], ['gate', 0]], n = SYL.length, slot = 334 / n, R = 40, CY = 100, HW = R * Math.sqrt(3) / 2;
    const hex = (cx, cy, rr) => [-90, -30, 30, 90, 150, 210].map(a => { const t = a * Math.PI / 180; return (cx + rr * Math.cos(t)).toFixed(1) + ',' + (cy + rr * Math.sin(t)).toFixed(1); }).join(' ');
    return SYL.map((s, i) => {
      const cx = +(slot * (i + .5)).toFixed(1);
      let h = 0, cls = '', fill = '#FBF7EC', fg = '#1C2B24', edge = '#3A5E4F';
      if (mode === 'rec' && k >= i + 1) { h = 50; cls = k === i + 1 ? 'hbub' : ''; }
      if (mode === 'check') { h = 58; cls = 'hfill' + (i % 3 + 1); }
      if (mode === 'none') { fill = '#3A5E4F'; fg = '#DDE7DA'; edge = '#5E7F70'; }
      return { text: s[0], px: (s[1] ? 21 : 16) + 'px', fg, edge, cellFill: fill, pts: hex(cx, CY, R),
        clipId: mode + 'Hx' + i, clipUrl: 'url(#' + mode + 'Hx' + i + ')',
        hx: (cx - HW).toFixed(1), hw: (2 * HW).toFixed(1), hy: (CY + R - h).toFixed(1), hh: h,
        honey: mode === 'rec' ? '#F2D28B' : '#F2C744', honeyClass: cls,
        left: (cx / 334 * 100).toFixed(2) + '%', top: (CY / 150 * 100).toFixed(2) + '%', cx };
    });
  }
  renderVals() {
    const m = this.props.moment ?? this.state.moment ?? 'MI';
    const order = ['beep', 'MI', 'ti', 'gate'];
    const k = order.indexOf(m);
    const lit = '#E8C66A', dark = '#5E7F70';
    return {
      cells: this.comb('rec', k), combTitle: k === 0 ? 'Waiting for your voice' : 'Filling as you speak',
      combLabel: k === 0 ? 'Empty cells waiting for your voice' : 'Cells fill as Dygo hears each part: ' + order.slice(1, k + 1).join(', ') + '. This is your live voice, not your score',
      voiceHint: k === 0 ? 'Starting…' : 'Recording', voiceFg: k === 0 ? '#5E6A62' : '#B4552E', voiceRec: k !== 0, voiceCls: k === 0 ? 'quiet' : '',
      prompt: k === 0 ? 'Beep! Say it now' : 'Keep going…',
      status: k === 0 ? 'Say “mitigate” now' : 'Listening…',
      c1: k >= 1 ? lit : dark, c2: k >= 2 ? lit : dark, c3: k >= 3 ? lit : dark,
      t2: k >= 2 ? '#1C2B24' : '#F4F1EA', t3: k >= 3 ? '#1C2B24' : '#F4F1EA',
      s1: k === 1, s2: k === 2, s3: k === 3,
      beeT: 'translate(' + (k <= 1 ? 55.7 : (k === 2 ? 167 : 278.3)) + ',34)',
    };
  }
}
</script>
