<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pronunciation · Checking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1EA;color:#1C2B24}
a{color:#B4552E}a:hover{color:#8A3E20}
@keyframes shim{0%,100%{opacity:.45}50%{opacity:1}}
.sh1{animation:shim 1.2s ease-in-out infinite}.sh2{animation:shim 1.2s ease-in-out .2s infinite}.sh3{animation:shim 1.2s ease-in-out .4s infinite}
@keyframes dots{0%,80%,100%{opacity:.25}40%{opacity:1}}
.dot{animation:dots 1.4s ease-in-out infinite}
@keyframes hov{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hov{animation:hov 1.6s ease-in-out infinite}
@keyframes hfill{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.hfill1,.hfill2,.hfill3,.hbub{transform-box:fill-box;transform-origin:50% 100%}
.hfill1{animation:hfill 1.4s ease-in-out infinite}.hfill2{animation:hfill 1.4s ease-in-out .25s infinite}.hfill3{animation:hfill 1.4s ease-in-out .5s infinite}
@keyframes hbub{0%,100%{transform:scaleY(.82)}50%{transform:scaleY(1)}}
.hbub{animation:hbub .5s ease-in-out infinite}
@keyframes hhov{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hhov{animation:hhov 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; display: flex; flex-direction: column; gap: 16px; padding: 20px 18px 26px; font-family: 'DM Sans', sans-serif; color: #1C2B24; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px"></span>
<span style="flex-grow: 1; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #3E7F5A">Pronunciation</span>
<span style="width: 74px; text-align: right; font-size: 13px; font-weight: 700; color: #5E6A62">Bee 1 of 3</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
<span lang="en" style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 44px; line-height: 1.05">mitigate</span>
<span style="font-size: 16px; color: #5E6A62">Got it. Checking each cell…</span>
</div>
<div style="border-radius: 26px; background: #24463A; overflow: hidden; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px 0">
<span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #DDE7DA">{{combTitle}}</span>
</div>
<div style="position: relative">
<svg width="100%" viewBox="0 0 334 150" role="img" aria-label="{{combLabel}}" style="display: block; height: auto">
<defs><sc-for list="{{cells}}" as="c" hint-placeholder-count="3"><clipPath id="{{c.clipId}}"><polygon points="{{c.pts}}"></polygon></clipPath></sc-for></defs>
<sc-for list="{{cells}}" as="c" hint-placeholder-count="3"><polygon points="{{c.pts}}" fill="{{c.cellFill}}"></polygon><g clip-path="{{c.clipUrl}}"><rect class="{{c.honeyClass}}" x="{{c.hx}}" y="{{c.hy}}" width="{{c.hw}}" height="{{c.hh}}" fill="{{c.honey}}"></rect></g><polygon points="{{c.pts}}" fill="none" stroke="{{c.edge}}" stroke-width="2.5" stroke-linejoin="round"></polygon></sc-for>
<g transform="{{beeT}}"><g class="hhov"><g transform="scale(1.15)"><g transform="translate(-16,-17)"><ellipse cx="12" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(-25 12 9)"></ellipse><ellipse cx="20" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(25 20 9)"></ellipse><ellipse cx="16" cy="19" rx="9" ry="7" fill="#F2C744"></ellipse><path d="M12 13.2 V24.8" stroke="#3B3020" stroke-width="2.4"></path><path d="M17 12.2 V25.8" stroke="#3B3020" stroke-width="2.4"></path><circle cx="23.5" cy="17.5" r="1.3" fill="#3B3020"></circle></g></g></g></g>
</svg>
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none"><sc-for list="{{cells}}" as="c" hint-placeholder-count="3"><span lang="en" style="position: absolute; left: {{c.left}}; top: {{c.top}}; transform: translate(-50%, -50%); font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: {{c.px}}; line-height: 1; color: {{c.fg}}; white-space: nowrap">{{c.text}}</span></sc-for></div>
</div>
</div>
<div style="border-radius: 22px; background: #FFFFFF; border: 1px solid #E3DDD0; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5E6A62">While Dygo checks</span><span style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; line-height: 1.15">Have a listen</span></span>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<button aria-label="Play the native speaker saying mitigate" style="height: 60px; border-radius: 16px; border: 1px solid #C9D8C4; background: #F1F6EF; color: #24463A; display: flex; align-items: center; gap: 10px; padding: 0 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; text-align: left; min-width: 0"><span style="width: 36px; height: 36px; border-radius: 18px; background: #24463A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4 L20 12 L7 20 Z"></path></svg></span><span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 700; font-size: 15px">Native</span><span style="font-size: 12px; font-weight: 600; color: #4E5A52; white-space: nowrap">1. Listen</span></span></button>
<button aria-label="Play your recording of mitigate" style="height: 60px; border-radius: 16px; border: 1px solid #EBC7B6; background: #FBF1EC; color: #8A3E20; display: flex; align-items: center; gap: 10px; padding: 0 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; text-align: left; min-width: 0"><span style="width: 36px; height: 36px; border-radius: 18px; background: #B4552E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4 L20 12 L7 20 Z"></path></svg></span><span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 700; font-size: 15px">Your try</span><span style="font-size: 12px; font-weight: 600; color: #6E4A3A; white-space: nowrap">2. Compare</span></span></button>
</div>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px">
<a href="PronStonesResult.dc.html" aria-label="Checking, usually 1 to 2 seconds" style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-decoration: none"><span style="display: flex; gap: 8px" aria-hidden="true"><span class="dot" style="width: 12px; height: 12px; border-radius: 6px; background: #24463A"></span><span class="dot" style="width: 12px; height: 12px; border-radius: 6px; background: #24463A; animation-delay: .2s"></span><span class="dot" style="width: 12px; height: 12px; border-radius: 6px; background: #24463A; animation-delay: .4s"></span></span>
<span style="font-size: 15px; font-weight: 600; color: #5E6A62">Usually 1–2 seconds</span></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  comb(mode, k) {
    const SYL = [['MI', 1], ['ti', 0], ['gate', 0]], n = SYL.length, slot = 334 / n, R = 40, CY = 100, HW = R * Math.sqrt(3) / 2;
    const hex = (cx, cy, rr) => [-90, -30, 30, 90, 150, 210].map(a => { const t = a * Math.PI / 180; return (cx + rr * Math.cos(t)).toFixed(1) + ',' + (cy + rr * Math.sin(t)).toFixed(1); }).join(' ');
    return SYL.map((s, i) => {
      const cx = +(slot * (i + .5)).toFixed(1);
      let h = 0, cls = '', fill = '#FBF7EC', fg = '#1C2B24', edge = '#3A5E4F';
      if (mode === 'rec' && k >= i + 1) { h = 50; cls = k === i + 1 ? 'hbub' : ''; }
      if (mode === 'check') { h = 58; cls = 'hfill' + (i % 3 + 1); }
      if (mode === 'none') { fill = '#3A5E4F'; fg = '#DDE7DA'; edge = '#5E7F70'; }
      return { text: s[0], px: (s[1] ? 21 : 16) + 'px', fg, edge, cellFill: fill, pts: hex(cx, CY, R),
        clipId: mode + 'Hx' + i, clipUrl: 'url(#' + mode + 'Hx' + i + ')',
        hx: (cx - HW).toFixed(1), hw: (2 * HW).toFixed(1), hy: (CY + R - h).toFixed(1), hh: h,
        honey: mode === 'rec' ? '#F2D28B' : '#F2C744', honeyClass: cls,
        left: (cx / 334 * 100).toFixed(2) + '%', top: (CY / 150 * 100).toFixed(2) + '%', cx };
    });
  }
  renderVals() { return { cells: this.comb('check', 0), combTitle: 'Measuring the honey', combLabel: 'Honey rises and falls in each cell while Dygo checks', beeT: 'translate(167,34)' }; }
}
</script>
</body>
</html>
