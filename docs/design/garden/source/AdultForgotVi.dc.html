<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đặt lại mật khẩu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'DM Sans','Be Vietnam Pro',sans-serif;background:#F4F1EA;color:#1C2B24}
a{color:#B4552E}a:hover{color:#8A3E20}
@keyframes rise{0%{transform:translateY(12px);opacity:0}100%{transform:translateY(0);opacity:1}}
.rise{animation:rise .25s ease-out}
@keyframes fall{0%{transform:translateY(-4px);opacity:0}40%{opacity:1}100%{transform:translateY(10px);opacity:0}}
.fall{animation:fall 1.4s linear infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; display: flex; flex-direction: column; gap: 16px; padding: 22px 20px 28px; font-family: 'DM Sans', 'Be Vietnam Pro', sans-serif; color: #1C2B24; overflow: hidden; position: relative">
<div style="display: flex; justify-content: space-between; align-items: center"><a href="AdultLoginVi.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3DDD0; display: flex; align-items: center; justify-content: center; color: #1C2B24; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg></a><span style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3DDD0; font-size: 13px; font-weight: 600; color: #1C2B24"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#24463A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12 H21"></path><path d="M12 3 C15 6 15 18 12 21 C9 18 9 6 12 3"></path></svg>Tiếng Việt<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5E6A62" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9 L12 15 L18 9"></path></svg></span></div>
<div style="display: flex; flex-direction: column; gap: 4px; margin-top: 8px">
<span style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px; line-height: 1.1">Đặt lại mật khẩu</span>
<span style="font-size: 15px; color: #5E6A62">Chúng tôi sẽ gửi email kèm link để bạn đặt mật khẩu mới.</span>
</div>
<sc-if value="{{notSent}}" hint-placeholder-val="{{true}}">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5E6A62">Email</span><span style="min-height: 48px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 14px; padding: 12px 14px; font-size: 16px; color: #1C2B24; line-height: 1.4; display: flex; align-items: center; justify-content: space-between"><span>minh@example.com</span></span></label>
<button onClick="{{send}}" style="height: 58px; border-radius: 18px; background: #B4552E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; text-decoration: none; box-shadow: 0 4px 0 #7E3719; border: none; font-family: 'DM Sans', 'Be Vietnam Pro', sans-serif; cursor: pointer; width: 100%">Gửi link đặt lại</button>
</sc-if>
<sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
<div class="rise" style="background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 22px; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 C12 2 4 11 4 15 A8 8 0 0 0 20 15 C20 11 12 2 12 2 Z" fill="#8EC5E8"></path></svg>
<span style="font-weight: 700; font-size: 17px">Kiểm tra hộp thư</span>
<span style="font-size: 14px; color: #5E6A62; line-height: 1.4">Chúng tôi đã gửi link đến minh@example.com. Link có hiệu lực trong 1 giờ.</span>
</div>
<a href="AdultLoginVi.dc.html" style="height: 58px; border-radius: 18px; background: #B4552E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; text-decoration: none; box-shadow: 0 4px 0 #7E3719; border: none; font-family: 'DM Sans', 'Be Vietnam Pro', sans-serif; cursor: pointer; width: 100%">Quay lại đăng nhập</a>
<button onClick="{{resend}}" style="border: none; background: none; font-family: 'DM Sans', 'Be Vietnam Pro', sans-serif; font-size: 14px; font-weight: 700; color: #24463A; cursor: pointer">Chưa nhận được? Gửi lại</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sent: false }; }
  renderVals() {
    const s = this.state;
    return { sent: s.sent, notSent: !s.sent, send: () => this.setState({ sent: true }), resend: () => this.setState({ sent: false }) };
  }
}
</script>
</body>
</html>
