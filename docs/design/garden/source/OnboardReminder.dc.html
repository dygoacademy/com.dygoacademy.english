<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reminder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'DM Sans', sans-serif;background:#F4F1EA;color:#1C2B24}
a{color:#B4552E}a:hover{color:#8A3E20}
@keyframes rise{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
.rise{animation:rise .25s ease-out}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; display: flex; flex-direction: column; gap: 14px; padding: 22px 20px 24px; font-family: 'DM Sans', sans-serif; color: #1C2B24; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px">
<a href="OnboardLevel.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3DDD0; display: flex; align-items: center; justify-content: center; color: #1C2B24; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg></a>
<div role="progressbar" aria-valuemin="1" aria-valuemax="2" aria-valuenow="2" aria-label="Step 2 of 2" style="flex-grow: 1; display: flex; align-items: center; gap: 4px"><span style="width: 40px; height: 40px; border-radius: 20px; background: #DDE7DA; display: flex; align-items: flex-end; justify-content: center; overflow: hidden"><svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="33" rx="6" ry="4" fill="#6B5040"></ellipse><path d="M20 30 C20 26 22 24 25 23" stroke="#7FA487" stroke-width="2.4" fill="none" stroke-linecap="round"></path></svg></span><span style="flex-grow: 1; height: 3px; border-radius: 2px; background: #7FA487"></span><span style="width: 40px; height: 40px; border-radius: 20px; background: #24463A; display: flex; align-items: flex-end; justify-content: center; overflow: hidden"><svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 40 V22" stroke="#7FA487" stroke-width="2.5"></path><path d="M20 30 C14 29 11 25 13 21 C18 21 20 25 20 30 Z" fill="#9CC39A"></path><path d="M20 27 C26 26 29 22 27 18 C22 18 20 22 20 27 Z" fill="#B7D6AE"></path></svg></span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; line-height: 1.1">When should we water?</span>
<span style="font-size: 15px; color: #5E6A62; line-height: 1.4">One reminder a day, when your words are ripe. Change it any time in Profile.</span>
</div>
<div role="radiogroup" aria-label="When should we water?" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" role="radio" aria-checked="{{o.checked}}" style="height: 72px; border-radius: 18px; border: 2px solid {{o.border}}; background: {{o.bg}}; display: flex; align-items: center; gap: 14px; padding: 0 16px; cursor: pointer; text-align: left; font-family: inherit; color: #1C2B24">
<span style="width: 44px; height: 44px; border-radius: 22px; background: {{o.iconBg}}; color: {{o.iconFg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><sc-if value="{{o.night}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14 A8 8 0 1 1 10 4 A6 6 0 0 0 20 14 Z"></path></svg></sc-if><sc-if value="{{o.day}}" hint-placeholder-val="{{true}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2 V4 M12 20 V22 M2 12 H4 M20 12 H22 M4.9 4.9 L6.3 6.3 M17.7 17.7 L19.1 19.1 M4.9 19.1 L6.3 17.7 M17.7 6.3 L19.1 4.9"></path></svg></sc-if></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 16px">{{o.label}} · {{o.time}}</span><span style="font-size: 13px; color: #5E6A62">{{o.line}}</span></span>
<span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #24463A; background: {{o.dot}}; box-shadow: inset 0 0 0 3px #FFFFFF; flex-shrink: 0"></span>
</button></sc-for>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px"><a href="OnboardReady.dc.html" style="height: 56px; border-radius: 18px; background: #B4552E; color: #FFFFFF; box-shadow: 0 4px 0 #7E3719; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-decoration: none; width: 100%; box-sizing: border-box">{{cta}}</a>
<a href="OnboardReady.dc.html" style="align-self: center; font-size: 14px; font-weight: 600; color: #5E6A62; padding: 8px">Not now</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { time: '7:30' }; }
  renderVals() {
    const s = this.state;
    const opts = [['7:30', 'Morning', 'Before work or class'], ['12:30', 'Lunch', 'A short break'], ['21:00', 'Evening', 'Wind down with words']].map(([time, label, line]) => { const on = s.time === time; const night = time === '21:00'; return { time, label, line, night, day: !night,
      checked: on ? 'true' : 'false', bg: on ? '#F1F6EF' : '#FFFFFF', border: on ? '#24463A' : '#E3DDD0', dot: on ? '#24463A' : '#FFFFFF',
      iconBg: night ? '#24463A' : '#FBF4E4', iconFg: night ? '#F2D28B' : '#B07A12', pick: () => this.setState({ time }) }; });
    return { opts, cta: 'Remind me at {t}'.replace('{t}', s.time) };
  }
}
</script>
</body>
</html>
