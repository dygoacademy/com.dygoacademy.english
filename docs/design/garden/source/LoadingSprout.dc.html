<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dygo · Loading · Seed to sprout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.ld *{box-sizing:border-box}
.ld svg [class]{transform-box:fill-box}
.wl{transform-origin:center bottom;animation:flapL .16s ease-in-out infinite alternate}
.wr{transform-origin:center bottom;animation:flapR .16s ease-in-out infinite alternate}
@keyframes flapL{to{transform:scaleY(.5)}}
@keyframes flapR{to{transform:scaleY(.5)}}
.dots i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:4px;background:currentColor;opacity:.25;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{30%{opacity:1;transform:translateY(-2px)}60%{opacity:.25;transform:none}}
.lines{position:relative;height:22px;width:100%}
.lines span{position:absolute;left:0;right:0;text-align:center;opacity:0;animation:line 7.5s infinite}
.lines span:first-child{opacity:1}
.lines span:nth-child(2){animation-delay:2.5s}.lines span:nth-child(3){animation-delay:5s}
@keyframes line{0%{opacity:0;transform:translateY(6px)}5%,28%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-6px)}}
.reduced *, .reduced *::before{animation:none !important}

.seed{animation:seed 4s ease-in infinite}
@keyframes seed{0%{transform:translateY(-46px);opacity:0}8%{opacity:1}18%,100%{transform:none;opacity:1}}
.seedc{animation:seedc 4s infinite}
@keyframes seedc{0%,30%{opacity:1}36%,100%{opacity:0}}
.soil{transform-origin:center;animation:soil 4s infinite}
@keyframes soil{0%,16%{transform:scaleX(1)}20%{transform:scaleX(1.12)}26%,100%{transform:scaleX(1)}}
.stem{stroke-dasharray:36;stroke-dashoffset:0;animation:stem 4s ease-out infinite}
@keyframes stem{0%,22%{stroke-dashoffset:36}42%,100%{stroke-dashoffset:0}}
.leafL{transform-origin:right bottom;animation:leafL 4s cubic-bezier(.3,1.5,.5,1) infinite}
@keyframes leafL{0%,38%{transform:scale(0)}54%,100%{transform:scale(1)}}
.leafR{transform-origin:left bottom;animation:leafR 4s cubic-bezier(.3,1.5,.5,1) infinite}
@keyframes leafR{0%,48%{transform:scale(0)}64%,100%{transform:scale(1)}}
.beeA{offset-path:path("M-30 10 C 0 -10, 40 40, 66 20");offset-rotate:0deg;offset-distance:100%;animation:beeA 4s ease-in-out infinite}
@keyframes beeA{0%,60%{offset-distance:0%;opacity:0}64%{opacity:1}84%,100%{offset-distance:100%;opacity:1}}
.beebob{animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2px)}}
.fadeAll{animation:fadeAll 4s infinite}
@keyframes fadeAll{0%,92%{opacity:1}100%{opacity:0}}
.sway{transform-origin:50% 79%;animation:sway 2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}

</style>
</helmet>
<div class="{{rootCls}}" style="width:390px;height:844px;background:#F4F1EA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:{{font}};color:#1C2B24;position:relative;overflow:hidden">
<svg width="240" height="240" viewBox="0 0 100 100" aria-hidden="true" style="overflow:visible">
<g class="fadeAll">
<ellipse class="soil" cx="50" cy="80" rx="22" ry="4.5" fill="#E3DDD0"></ellipse>
<ellipse class="seedc seed" cx="50" cy="77" rx="3.2" ry="2.4" fill="#8A6A4A"></ellipse>
<g class="sway">
<path class="stem" d="M50 79 V44" stroke="#24463A" stroke-width="5.5" stroke-linecap="round" fill="none"></path>
<path class="leafL" d="M50 64 C36 64 26 54 29 41 C42 40 50 50 50 64 Z" fill="#24463A"></path>
<path class="leafR" d="M50 52 C64 51 74 41 71 27 C58 27 50 37 50 52 Z" fill="#3D6B57"></path>
</g>
<g class="beeA"><g class="beebob"><g transform="translate(-12.8 -14) scale(.8)"><g class="wings"><g class="wl"><ellipse cx="12" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(-25 12 9)"></ellipse></g><g class="wr"><ellipse cx="20" cy="9" rx="6" ry="4.5" fill="#E8F2F8" stroke="#BFD8E8" stroke-width="1" transform="rotate(25 20 9)"></ellipse></g></g><ellipse cx="16" cy="19" rx="9" ry="7" fill="#F2C744"></ellipse><path d="M12 13.2 V24.8" stroke="#3B3020" stroke-width="2.4"></path><path d="M17 12.2 V25.8" stroke="#3B3020" stroke-width="2.4"></path><circle cx="23.5" cy="17.5" r="1.3" fill="#3B3020"></circle><path d="M7 19 L5 19" stroke="#3B3020" stroke-width="1.6" stroke-linecap="round"></path></g></g></g>
</g>
</svg>
<div style="font-family:'Fraunces',serif;font-weight:600;font-size:38px;letter-spacing:-.01em;color:#24463A;margin-top:6px">dygo</div>
<div class="lines" style="margin-top:14px;font-size:15px;color:#5E6A62"><span>{{l1}}</span><span>{{l2}}</span><span>{{l3}}</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}, "lang": {"editor": "enum", "options": ["en", "vi"], "default": "en", "section": "Demo"}, "motion": {"editor": "enum", "options": ["animated", "reduced"], "default": "animated", "section": "Demo"}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang ?? this.state.lang ?? 'en';
    const motion = this.props.motion ?? this.state.motion ?? 'animated';
    const vi = lang === 'vi';
    const T = (en, v) => vi ? v : en;
    return {
      rootCls: 'ld' + (motion === 'reduced' ? ' reduced' : ''),
      font: vi ? "'Be Vietnam Pro', 'DM Sans', sans-serif" : "'DM Sans', sans-serif",
      l1: T('Watering your garden…', 'Đang tưới khu vườn…'),
      l2: T('Waking the bees…', 'Đang gọi đàn ong dậy…'),
      l3: T("Ripening today's words…", 'Đang ủ chín từ hôm nay…'),
    };
  }
}
</script>
</body>
</html>
