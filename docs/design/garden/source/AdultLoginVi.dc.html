<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng nhập</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'DM Sans','Be Vietnam Pro',sans-serif;background:#F4F1EA;color:#1C2B24}
a{color:#B4552E}a:hover{color:#8A3E20}
@keyframes rise{0%{transform:translateY(12px);opacity:0}100%{transform:translateY(0);opacity:1}}
.rise{animation:rise .25s ease-out}
@keyframes fall{0%{transform:translateY(-4px);opacity:0}40%{opacity:1}100%{transform:translateY(10px);opacity:0}}
.fall{animation:fall 1.4s linear infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; display: flex; flex-direction: column; gap: 16px; padding: 22px 20px 28px; font-family: 'DM Sans', 'Be Vietnam Pro', sans-serif; color: #1C2B24; overflow: hidden; position: relative">
<div style="display: flex; justify-content: flex-end"><span style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3DDD0; font-size: 13px; font-weight: 600; color: #1C2B24"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#24463A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12 H21"></path><path d="M12 3 C15 6 15 18 12 21 C9 18 9 6 12 3"></path></svg>Tiếng Việt<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5E6A62" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9 L12 15 L18 9"></path></svg></span></div>
<div style="height: 120px; border-radius: 26px; background: #24463A; display: flex; align-items: flex-end; justify-content: center; gap: 10px; overflow: hidden; padding-bottom: 12px; box-sizing: border-box"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 40 V22" stroke="#9CC39A" stroke-width="2.5"></path><path d="M20 30 C14 29 11 25 13 21 C18 21 20 25 20 30 Z" fill="#9CC39A"></path><path d="M20 27 C26 26 29 22 27 18 C22 18 20 22 20 27 Z" fill="#B7D6AE"></path></svg><svg width="40" height="50" viewBox="0 0 40 52" aria-hidden="true"><path d="M20 52 V20" stroke="#9CC39A" stroke-width="2.5"></path><path d="M20 38 C14 37 11 33 13 29 C18 29 20 33 20 38 Z" fill="#9CC39A"></path><circle cx="20" cy="10" r="5" fill="#E8A87C"></circle><circle cx="26" cy="15" r="5" fill="#E8A87C"></circle><circle cx="24" cy="22" r="5" fill="#E8A87C"></circle><circle cx="16" cy="22" r="5" fill="#E8A87C"></circle><circle cx="14" cy="15" r="5" fill="#E8A87C"></circle><circle cx="20" cy="17" r="4" fill="#F2D28B"></circle></svg><svg width="46" height="50" viewBox="0 0 44 56" aria-hidden="true"><rect x="20" y="30" width="4" height="26" fill="#8A6A4F"></rect><circle cx="22" cy="20" r="15" fill="#7FA487"></circle><circle cx="11" cy="29" r="9" fill="#7FA487"></circle><circle cx="33" cy="29" r="9" fill="#7FA487"></circle><circle cx="16" cy="18" r="3" fill="#E0B04A"></circle><circle cx="28" cy="22" r="3" fill="#E0B04A"></circle></svg><svg width="40" height="50" viewBox="0 0 40 52" aria-hidden="true"><path d="M20 52 V20" stroke="#9CC39A" stroke-width="2.5"></path><path d="M20 38 C14 37 11 33 13 29 C18 29 20 33 20 38 Z" fill="#9CC39A"></path><circle cx="20" cy="10" r="5" fill="#E8A87C"></circle><circle cx="26" cy="15" r="5" fill="#E8A87C"></circle><circle cx="24" cy="22" r="5" fill="#E8A87C"></circle><circle cx="16" cy="22" r="5" fill="#E8A87C"></circle><circle cx="14" cy="15" r="5" fill="#E8A87C"></circle><circle cx="20" cy="17" r="4" fill="#F2D28B"></circle></svg><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 40 V22" stroke="#9CC39A" stroke-width="2.5"></path><path d="M20 30 C14 29 11 25 13 21 C18 21 20 25 20 30 Z" fill="#9CC39A"></path><path d="M20 27 C26 26 29 22 27 18 C22 18 20 22 20 27 Z" fill="#B7D6AE"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; line-height: 1.1">Chào mừng trở lại</span>
<span style="font-size: 15px; color: #5E6A62">Đăng nhập để tưới các từ hôm nay.</span>
</div>
<sc-if value="{{error}}" hint-placeholder-val="{{false}}">
<div role="alert" style="background: #F6E3DC; color: #8A3E20; border-radius: 14px; padding: 10px 12px; font-size: 14px; line-height: 1.35">Email hoặc mật khẩu không đúng. Hãy thử lại hoặc đặt lại mật khẩu.</div>
</sc-if>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5E6A62">Email</span><span style="min-height: 48px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 14px; padding: 12px 14px; font-size: 16px; color: #1C2B24; line-height: 1.4; display: flex; align-items: center; justify-content: space-between"><span>minh@example.com</span></span></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5E6A62">Mật khẩu</span><span style="min-height: 48px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 14px; padding: 12px 14px; font-size: 16px; color: #1C2B24; line-height: 1.4; display: flex; align-items: center; justify-content: space-between"><span>{{pw}}</span><button onClick="{{toggleShow}}" style="border: none; background: none; font-family: 'DM Sans', 'Be Vietnam Pro', sans-serif; font-size: 14px; font-weight: 700; color: #24463A; cursor: pointer; padding: 0">{{showLabel}}</button></span></label>
<a href="AdultForgotVi.dc.html" style="align-self: flex-end; font-size: 14px; font-weight: 600; color: #24463A; margin-top: -6px">Quên mật khẩu?</a>
<button onClick="{{signIn}}" style="height: 58px; border-radius: 18px; background: #B4552E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; text-decoration: none; box-shadow: 0 4px 0 #7E3719; border: none; font-family: 'DM Sans', 'Be Vietnam Pro', sans-serif; cursor: pointer; width: 100%; margin-top: auto">Đăng nhập</button>
<span style="text-align: center; font-size: 14px; color: #5E6A62">Mới dùng Dygo? <a href="AdultRegisterVi.dc.html" style="font-weight: 700; color: #24463A">Tạo tài khoản</a></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { show: false, error: false }; }
  renderVals() {
    const s = this.state;
    return {
      pw: s.show ? 'garden2026' : '••••••••••',
      showLabel: s.show ? 'Ẩn' : 'Hiện',
      toggleShow: () => this.setState({ show: !s.show }),
      error: s.error,
      signIn: () => this.setState({ error: !s.error })
    };
  }
}
</script>
</body>
</html>
