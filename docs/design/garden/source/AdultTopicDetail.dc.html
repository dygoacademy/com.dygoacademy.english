</div>

size: 12px; color: {{b.statusColor}}; font-weight: 600">{{b.status}}</span></span><sc-if value="{{b.waiting}}" hint-placeholder-val="{{true}}"><button onClick="{{b.say}}" aria-label="{{b.label}}" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #B4552E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #7E3719; cursor: pointer; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11 A7 7 0 0 0 19 11"></path><path d="M12 18 V21"></path></svg></button></sc-if><sc-if value="{{b.done}}" hint-placeholder-val="{{false}}"><span class="spark" style="width: 36px; height: 36px; border-radius: 18px; background: #3E7F5A; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-right: 4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12 L10 17 L19 7"></path></svg></span></sc-if></div></sc-for></div>

<sc-if value="{{w.isSprout}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 40 40" aria-label="sprout"><path d="M20 40 V22" stroke="#7FA487" stroke-width="2.5"></path><path d="M20 30 C14 29 11 25 13 21 C18 21 20 25 20 30 Z" fill="#9CC39A"></path><path d="M20 27 C26 26 29 22 27 18 C22 18 20 22 20 27 Z" fill="#B7D6AE"></path></svg></sc-if>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stage: null, done: { mitigate: true } };
  }
  renderVals() {
    const sel = this.state.stage;
    const all = [
      { word: 'drought', vi: 'hạn hán · tricky, 5 lapses', stage: 'sprout', wilt: true, due: 'Due now', order: 0 },
      { word: 'deteriorate', vi: 'xấu đi, suy giảm', stage: 'sprout', due: 'Due now', order: 1 },
      { word: 'mitigate', vi: 'giảm nhẹ, làm dịu bớt', stage: 'flower', due: 'Due now', order: 2 },
      { word: 'conservation', vi: 'sự bảo tồn', stage: 'sprout', due: 'Due now', order: 3 },
      { word: 'biodiversity', vi: 'đa dạng sinh học', stage: 'seed', due: 'New', order: 4 },
      { word: 'carbon footprint', vi: 'lượng khí thải carbon', stage: 'seed', due: 'New', order: 5 },
      { word: 'deforestation', vi: 'nạn phá rừng', stage: 'flower', due: 'in 3 days', order: 6 },
      { word: 'ecosystem', vi: 'hệ sinh thái', stage: 'flower', due: 'in 5 days', order: 7 },
      { word: 'renewable', vi: 'có thể tái tạo', stage: 'tree', due: 'in 9 days', order: 8 },
      { word: 'sustainable', vi: 'bền vững', stage: 'tree', due: 'in 12 days', order: 9 },
      { word: 'emissions', vi: 'khí thải', stage: 'tree', due: 'in 20 days', order: 10 }
    ];
    const counts = { seed: 12, sprout: 11, flower: 7, tree: 18 };
    const names = { seed: 'Seeds', sprout: 'Sprouts', flower: 'Flowers', tree: 'Fruiting' };
    const tabs = ['seed', 'sprout', 'flower', 'tree'].map((id) => {
      const on = sel === id;
      return {
        count: counts[id], label: names[id],
        isSeed: id === 'seed', isSprout: id === 'sprout', isFlower: id === 'flower', isTree: id === 'tree',
        bg: on ? '#24463A' : '#FFFFFF',
        border: on ? '#24463A' : '#E3DDD0',
        color: on ? '#FFFFFF' : '#1C2B24',
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ stage: on ? null : id })
      };
    });
    const words = all
      .filter((w) => !sel || w.stage === sel)
      .map((w) => {
        const dueNow = w.due === 'Due now';
        return {
          word: w.word, vi: w.vi, due: w.due,
          isSeed: w.stage === 'seed',
          isSprout: w.stage === 'sprout' && !w.wilt,
          isWilt: !!w.wilt,
          isFlower: w.stage === 'flower',
          isTree: w.stage === 'tree',
          bg: w.wilt ? '#FBF4E4' : '#FFFFFF',
          border: w.wilt ? '#EFD9A6' : '#E3DDD0',
          dueColor: dueNow ? '#1D6A9A' : (w.due === 'New' ? '#9A6E14' : '#5E6A62')
        };
      });
    const W = [["mitigate", "MI \u00b7 ti \u00b7 gate"], ["deforestation", "de \u00b7 for \u00b7 e \u00b7 STA \u00b7 tion"], ["ecosystem", "E \u00b7 co \u00b7 sys \u00b7 tem"]];
    const left = W.filter(([w]) => !this.state.done[w]).length;
    const bees = W.map(([word, syl]) => {
      const done = !!this.state.done[word];
      return {
        word, syl, done, waiting: !done,
        status: done ? "Pollinated \u00b7 on its way to fruit" : "Say it to pollinate",
        statusColor: done ? '#3E7F5A' : '#8A3E20',
        bg: done ? '#F1F6EF' : '#FFFFFF',
        border: done ? '#CFE0C8' : '#EFD9A6',
        label: "Say {w} to pollinate".replace('{w}', word),
        say: () => this.setState({ done: Object.assign({}, this.state.done, { [word]: true }) })
      };
    });
    const intro = left === 0 ? "All flowers pollinated today. New bees come tomorrow." : left === 1 ? "1 flower wants to be heard. Say it to pollinate it." : "{n} flowers want to be heard. Say each word to pollinate it.".replace('{n}', left);
    return {
      tabs,
      words,
      bees,
      intro,
      listTitle: sel ? names[sel] + ' in this bed' : 'All words'
    };
  }
}
</script>
