<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Language &amp; accent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'DM Sans', sans-serif;background:#F4F1EA;color:#1C2B24}
a{color:#B4552E}a:hover{color:#8A3E20}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; display: flex; flex-direction: column; gap: 12px; padding: 22px 20px 24px; font-family: 'DM Sans', sans-serif; color: #1C2B24; overflow: hidden; position: relative">
<div style="display: flex; align-items: center; gap: 12px">
<a href="AdultMe.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3DDD0; display: flex; align-items: center; justify-content: center; color: #1C2B24; flex-shrink: 0; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg></a>
<span style="flex-grow: 1; font-family: 'Fraunces', serif; font-weight: 600; font-size: 24px; line-height: 1.15">Language &amp; accent</span>
</div>
<span style="font-size: 15px; color: #5E6A62; line-height: 1.4">The language Dygo speaks to you, and the English you hear.</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5E6A62; padding: 0 4px">App language</span>
<div role="radiogroup" aria-label="App language" style="background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 20px; padding: 0 16px; display: flex; flex-direction: column">
<sc-for list="{{apps}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" role="radio" aria-checked="{{o.checked}}" lang="{{o.lang}}" style="min-height: 54px; border: none; border-top: {{o.rule}}; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0; cursor: pointer; text-align: left; font-family: 'DM Sans', sans-serif; color: #1C2B24">
<span style="flex-grow: 1; font-weight: 700; font-size: 16px">{{o.title}}</span>
<span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #24463A; background: {{o.dot}}; box-shadow: inset 0 0 0 3px #FFFFFF; flex-shrink: 0; box-sizing: border-box"></span>
</button></sc-for>
</div>
<span style="font-size: 12px; color: #5E6A62; line-height: 1.4; padding: 0 4px">Menus, buttons and tips. The words you learn always stay in English.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5E6A62; padding: 0 4px">English accent</span>
<div role="radiogroup" aria-label="English accent" style="background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 20px; padding: 0 16px; display: flex; flex-direction: column">
<sc-for list="{{accents}}" as="o" hint-placeholder-count="2"><button onClick="{{o.pick}}" role="radio" aria-checked="{{o.checked}}" style="min-height: 54px; border: none; border-top: {{o.rule}}; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0; cursor: pointer; text-align: left; font-family: 'DM Sans', sans-serif; color: #1C2B24">
<span style="flex-grow: 1; font-weight: 700; font-size: 16px">{{o.title}}</span>
<span style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #24463A; background: {{o.dot}}; box-shadow: inset 0 0 0 3px #FFFFFF; flex-shrink: 0; box-sizing: border-box"></span>
</button></sc-for>
</div>
<span style="font-size: 12px; color: #5E6A62; line-height: 1.4; padding: 0 4px">Spelling, IPA and audio for every word follow this.</span>
</div>
<div style="margin-top: auto"><a href="AdultMe.dc.html" style="height: 56px; border-radius: 18px; background: #B4552E; color: #FFFFFF; box-shadow: 0 4px 0 #7E3719; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-decoration: none">Save</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { app: 'en', accent: 'us' }; }
  renderVals() {
    const s = this.state;
    const apps = [['en', 'English', 'en'], ['vi', 'Tiếng Việt', 'vi'], ['zh', '中文（简体）', 'zh-Hans']].map(([id, title, lang], i) => ({
      title, lang, checked: s.app === id ? 'true' : 'false', dot: s.app === id ? '#24463A' : '#FFFFFF',
      rule: i ? '1px solid #EFEAE0' : 'none', pick: () => this.setState({ app: id }) }));
    const accents = [['us', 'US English'], ['uk', 'UK English']].map(([id, title], i) => ({
      title, checked: s.accent === id ? 'true' : 'false', dot: s.accent === id ? '#24463A' : '#FFFFFF',
      rule: i ? '1px solid #EFEAE0' : 'none', pick: () => this.setState({ accent: id }) }));
    return { apps, accents };
  }
}
</script>
</body>
</html>
