<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Topics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F4F1EA;color:#1C2B24}
a{color:#B4552E}a:hover{color:#8A3E20}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; display: flex; flex-direction: column; gap: 14px; padding-top: 22px; font-family: 'DM Sans', sans-serif; color: #1C2B24; overflow: hidden">

<div style="display: flex; align-items: flex-end; gap: 12px; padding: 0 20px">
<div style="display: flex; flex-direction: column; flex-grow: 1">
<span style="font-size: 13px; font-weight: 500; color: #5E6A62">5 beds · 196 words</span>
<span style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px; line-height: 1.1">Topics</span>
</div>
<button aria-label="Search words and topics" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3DDD0; display: flex; align-items: center; justify-content: center; color: #1C2B24; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20 L16 16"></path></svg></button>
</div>

<div style="display: flex; gap: 8px; padding: 0 16px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button onClick="{{c.pick}}" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.color}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px">
<sc-for list="{{topics}}" as="t" hint-placeholder-count="5">
<a href="AdultTopicDetail.dc.html" style="height: 76px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 20px; padding: 0 14px 0 10px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1C2B24">
<span style="width: 56px; height: 56px; border-radius: 16px; background: #24463A; display: flex; align-items: flex-end; justify-content: center; flex-shrink: 0; overflow: hidden">
<sc-if value="{{t.tree}}" hint-placeholder-val="{{true}}"><svg width="46" height="50" viewBox="0 0 44 56" aria-hidden="true"><rect x="20" y="30" width="4" height="26" fill="#8A6A4F"></rect><circle cx="22" cy="20" r="15" fill="#7FA487"></circle><circle cx="11" cy="29" r="9" fill="#7FA487"></circle><circle cx="33" cy="29" r="9" fill="#7FA487"></circle><circle cx="16" cy="18" r="3" fill="#E0B04A"></circle><circle cx="28" cy="22" r="3" fill="#E0B04A"></circle></svg></sc-if>
<sc-if value="{{t.flower}}" hint-placeholder-val="{{false}}"><svg width="40" height="50" viewBox="0 0 40 52" aria-hidden="true"><path d="M20 52 V20" stroke="#9CC39A" stroke-width="2.5"></path><path d="M20 38 C14 37 11 33 13 29 C18 29 20 33 20 38 Z" fill="#9CC39A"></path><circle cx="20" cy="10" r="5" fill="#E8A87C"></circle><circle cx="26" cy="15" r="5" fill="#E8A87C"></circle><circle cx="24" cy="22" r="5" fill="#E8A87C"></circle><circle cx="16" cy="22" r="5" fill="#E8A87C"></circle><circle cx="14" cy="15" r="5" fill="#E8A87C"></circle><circle cx="20" cy="17" r="4" fill="#F2D28B"></circle></svg></sc-if>
<sc-if value="{{t.sprout}}" hint-placeholder-val="{{false}}"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 40 V22" stroke="#9CC39A" stroke-width="2.5"></path><path d="M20 30 C14 29 11 25 13 21 C18 21 20 25 20 30 Z" fill="#9CC39A"></path><path d="M20 27 C26 26 29 22 27 18 C22 18 20 22 20 27 Z" fill="#B7D6AE"></path></svg></sc-if>
</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0">
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<span style="font-weight: 700; font-size: 16px">{{t.title}}</span>
<sc-if value="{{t.hasDue}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; font-weight: 700; color: #1D4A68; background: #E3F0F8; padding: 3px 8px; border-radius: 10px; flex-shrink: 0">{{t.due}} due</span></sc-if>
<sc-if value="{{t.noDue}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 600; color: #3E7F5A; flex-shrink: 0">All watered</span></sc-if>
</span>
<span style="font-size: 12px; color: #5E6A62">{{t.meta}}</span>
<span style="display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: #EAE5DA">
<span style="width: {{t.wTree}}; background: #3E7F5A"></span>
<span style="width: {{t.wFlower}}; background: #E8A87C"></span>
<span style="width: {{t.wSprout}}; background: #B7D6AE"></span>
</span>
</span>
</a>
</sc-for>

<sc-if value="{{showLocked}}" hint-placeholder-val="{{true}}">
<div style="height: 76px; box-sizing: border-box; background: #EFEADF; border: 1px dashed #CFC6B2; border-radius: 20px; padding: 0 14px 0 10px; display: flex; align-items: center; gap: 12px">
<span style="width: 56px; height: 56px; border-radius: 16px; background: #E3DDD0; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="13" rx="6" ry="8" fill="#C9A45A"></ellipse><path d="M12 5 V21" stroke="#9A6E14" stroke-width="1.5"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
<span style="font-weight: 700; font-size: 16px; color: #4A4A40">Academic Word List</span>
<span style="font-size: 12px; color: #5E6A62">Seed pack · 1 more Golden Bloom this week</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6A62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Locked"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10 V7 A4 4 0 0 1 16 7 V10"></path></svg>
</div>
</sc-if>

<button style="height: 56px; border-radius: 18px; border: 1px dashed #B9AE96; background: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 15px; color: #24463A; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5 V19"></path><path d="M5 12 H19"></path></svg>
Plant a new bed
</button>
</div>

<nav style="margin-top: auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E3DDD0; padding: 8px 4px 20px">
<a href="AdultHome.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #5E6A62"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21 V11"></path><path d="M12 14 C7 14 5 10 5 7 C9 7 12 9 12 14 Z"></path><path d="M12 12 C17 12 19 8 19 5 C15 5 12 7 12 12 Z"></path><path d="M5 21 H19"></path></svg><span style="font-size: 12px; font-weight: 500">Garden</span></a>
<a href="AdultMissions.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #5E6A62"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.5"></circle></svg><span style="font-size: 12px; font-weight: 500">Missions</span></a>
<a href="AdultTopics.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #24463A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5 C4 4 5 4 6 4 H11 V20 H6 C5 20 4 20 4 19 Z"></path><path d="M20 5 C20 4 19 4 18 4 H13 V20 H18 C19 20 20 20 20 19 Z"></path></svg><span style="font-size: 12px; font-weight: 700">Topics</span></a>
<a href="AdultGroups.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #5E6A62"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><circle cx="17" cy="10" r="2.5"></circle><path d="M3 20 C3 15 6 13 9 13 C12 13 15 15 15 20"></path><path d="M15 15 C16 14 21 14 21 19"></path></svg><span style="font-size: 12px; font-weight: 500">Groups</span></a>
<a href="AdultMe.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; text-decoration: none; color: #5E6A62"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21 C4 16 8 14 12 14 C16 14 20 16 20 21"></path></svg><span style="font-size: 12px; font-weight: 500">Me</span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const f = this.state.filter;
    const raw = [
      { title: 'Environment', group: 'academic', level: 'B2–C1', words: 48, tree: 18, flower: 7, sprout: 11, due: 6 },
      { title: 'Education', group: 'academic', level: 'B2', words: 40, tree: 22, flower: 9, sprout: 5, due: 4 },
      { title: 'Technology', group: 'academic', level: 'B2–C1', words: 36, tree: 8, flower: 6, sprout: 12, due: 8 },
      { title: 'Work & careers', group: 'mine', level: 'B1–B2', words: 30, tree: 20, flower: 6, sprout: 2, due: 0 },
      { title: 'IELTS Sprint · Week 3', group: 'group', level: 'Shared', words: 42, tree: 12, flower: 10, sprout: 12, due: 5 }
    ];
    const pct = (n, total) => Math.round((n / total) * 100) + '%';
    const topics = raw
      .filter((t) => f === 'all' || t.group === f)
      .map((t) => {
        const top = Math.max(t.tree, t.flower, t.sprout);
        return {
          title: t.title,
          meta: t.words + ' words · ' + t.level + ' · ' + t.tree + ' fruiting',
          due: t.due,
          hasDue: t.due > 0,
          noDue: t.due === 0,
          tree: top === t.tree,
          flower: top !== t.tree && top === t.flower,
          sprout: top !== t.tree && top !== t.flower,
          wTree: pct(t.tree, t.words),
          wFlower: pct(t.flower, t.words),
          wSprout: pct(t.sprout, t.words)
        };
      });
    const chips = [['all', 'All'], ['academic', 'IELTS Academic'], ['mine', 'Mine']].map(([id, label]) => ({
      label,
      bg: f === id ? '#24463A' : '#FFFFFF',
      color: f === id ? '#FFFFFF' : '#1C2B24',
      border: f === id ? '#24463A' : '#E3DDD0',
      pick: () => this.setState({ filter: id })
    }));
    return { topics, chips, showLocked: f === 'all' || f === 'academic' };
  }
}
</script>
</body>
</html>
