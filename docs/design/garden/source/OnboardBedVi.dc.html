<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Luống đầu tiên</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'DM Sans','Be Vietnam Pro',sans-serif;background:#F4F1EA;color:#1C2B24}
a{color:#B4552E}a:hover{color:#8A3E20}
@keyframes rise{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
.rise{animation:rise .25s ease-out}
@keyframes bloom{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.bloom{animation:bloom .7s ease-out}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 3s ease-in-out infinite}
@keyframes ripple{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.5);opacity:0}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2s ease-out infinite}
@keyframes level{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.lvl{transform-box:fill-box;transform-origin:center;animation:level .8s ease-in-out infinite}
@keyframes sink{0%{transform:translateY(-30px);opacity:0}60%{transform:translateY(4px);opacity:1}100%{transform:translateY(0)}}
.sink{animation:sink .8s ease-out}
@keyframes flutter{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-6px)}}
.flutter{animation:flutter 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; display: flex; flex-direction: column; gap: 14px; padding: 22px 20px 24px; font-family: 'DM Sans', 'Be Vietnam Pro', sans-serif; color: #1C2B24; overflow: hidden; position: relative">
<div style="display: flex; align-items: center; gap: 10px">
<a href="OnboardLevelVi.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3DDD0; display: flex; align-items: center; justify-content: center; color: #1C2B24; flex-shrink: 0; cursor: pointer; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg></a>
<div role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="2" aria-label="Bước 2/3" style="flex-grow: 1; display: flex; align-items: center; gap: 4px"><span style="width: 40px; height: 40px; border-radius: 20px; background: #DDE7DA; display: flex; align-items: flex-end; justify-content: center; overflow: hidden"><svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="33" rx="6" ry="4" fill="#6B5040"></ellipse><path d="M20 30 C20 26 22 24 25 23" stroke="#7FA487" stroke-width="2.4" fill="none" stroke-linecap="round"></path></svg></span><span style="flex-grow: 1; height: 3px; border-radius: 2px; background: #7FA487"></span><span style="width: 40px; height: 40px; border-radius: 20px; background: #24463A; display: flex; align-items: flex-end; justify-content: center; overflow: hidden"><svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 40 V22" stroke="#7FA487" stroke-width="2.5"></path><path d="M20 30 C14 29 11 25 13 21 C18 21 20 25 20 30 Z" fill="#9CC39A"></path><path d="M20 27 C26 26 29 22 27 18 C22 18 20 22 20 27 Z" fill="#B7D6AE"></path></svg></span><span style="flex-grow: 1; height: 3px; border-radius: 2px; background: #E3DDD0"></span><span style="width: 40px; height: 40px; border-radius: 20px; border: 2px dashed #CFC6B2; box-sizing: border-box"></span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; line-height: 1.1">Chọn luống đầu tiên</span>
<span style="font-size: 15px; color: #5E6A62; line-height: 1.4">Chúng tôi sẽ gieo 10 hạt đầu tiên từ luống này. Thêm luống khác lúc nào cũng được.</span>
</div>
<div role="radiogroup" aria-label="Luống đầu tiên" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{beds}}" as="b" hint-placeholder-count="6"><button onClick="{{b.pick}}" role="radio" aria-checked="{{b.checked}}" style="position: relative; height: 150px; border-radius: 18px; border: 2px solid {{b.border}}; background: #FFFFFF; padding: 0; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; text-align: left; font-family: inherit; color: #1C2B24">
<span style="height: 64px; width: 100%; background: {{b.color}}; display: flex; align-items: flex-end; justify-content: center; position: relative">
<svg width="110" height="52" viewBox="0 0 110 52" aria-hidden="true"><path d="M0 52 Q55 20 110 52 Z" fill="rgba(255,255,255,.18)"></path><ellipse cx="55" cy="40" rx="9" ry="6" fill="#F4F1EA"></ellipse><path d="M55 34 C55 26 59 22 64 20" stroke="#F4F1EA" stroke-width="3" fill="none" stroke-linecap="round"></path><path d="M64 20 C70 18 72 12 70 8 C64 9 62 14 64 20 Z" fill="#F4F1EA"></path></svg>
<span style="position: absolute; left: 0; right: 0; top: 0; height: 8px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.5) 0 6px, transparent 6px 12px)"></span>
</span>
<span style="padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700; font-size: 15px; line-height: 1.2">{{b.title}}</span>
<span style="font-size: 12px; color: #5E6A62">{{b.meta}}</span>
</span>
<sc-if value="{{b.rec}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 12px; left: 8px; font-size: 11px; font-weight: 700; background: #F2D28B; color: #6B5215; padding: 2px 8px; border-radius: 8px">Hợp với IELTS</span></sc-if>
<sc-if value="{{b.on}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 13px; background: #24463A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12 L10 17 L19 7"></path></svg></span></sc-if>
</button></sc-for>
</div>
<div style="margin-top: auto"><a href="OnboardReminderVi.dc.html" style="height: 56px; border-radius: 18px; background: #B4552E; color: #FFFFFF; box-shadow: 0 4px 0 #7E3719; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'DM Sans', 'Be Vietnam Pro', sans-serif; font-weight: 700; font-size: 16px; text-decoration: none; cursor: pointer; width: 100%; box-sizing: border-box; padding: 0 16px">{{cta}}</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 'env' }; }
  renderVals() {
    const s = this.state;
    const beds = [{"id": "env", "title": "Môi trường", "meta": "48 từ · B2–C1", "color": "#3E7F5A", "rec": true}, {"id": "edu", "title": "Giáo dục", "meta": "40 từ · B2", "color": "#4A8FBF", "rec": false}, {"id": "tech", "title": "Công nghệ", "meta": "36 từ · B2–C1", "color": "#6B5BA8", "rec": false}, {"id": "work", "title": "Công việc", "meta": "30 từ · B1–B2", "color": "#B4552E", "rec": false}, {"id": "health", "title": "Sức khỏe", "meta": "34 từ · B1–B2", "color": "#C2477A", "rec": false}, {"id": "travel", "title": "Du lịch", "meta": "32 từ · B1", "color": "#C9A45A", "rec": false}].map((b) => ({
      ...b, on: s.pick === b.id, off: s.pick !== b.id, checked: s.pick === b.id ? 'true' : 'false',
      border: s.pick === b.id ? '#24463A' : '#E3DDD0', pick: () => this.setState({ pick: b.id })
    }));
    const cur = beds.find((b) => b.on);
    return { beds, cta: "Gieo " + cur.title };
  }
}
</script>
</body>
</html>
