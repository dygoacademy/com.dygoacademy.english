<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lời nhắc</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'DM Sans','Be Vietnam Pro',sans-serif;background:#F4F1EA;color:#1C2B24}
a{color:#B4552E}a:hover{color:#8A3E20}
@keyframes rise{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
.rise{animation:rise .25s ease-out}
@keyframes bloom{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.bloom{animation:bloom .7s ease-out}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 3s ease-in-out infinite}
@keyframes ripple{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.5);opacity:0}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2s ease-out infinite}
@keyframes level{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.lvl{transform-box:fill-box;transform-origin:center;animation:level .8s ease-in-out infinite}
@keyframes sink{0%{transform:translateY(-30px);opacity:0}60%{transform:translateY(4px);opacity:1}100%{transform:translateY(0)}}
.sink{animation:sink .8s ease-out}
@keyframes flutter{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-6px)}}
.flutter{animation:flutter 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1EA; display: flex; flex-direction: column; gap: 12px; padding: 20px 16px 24px; font-family: 'DM Sans', 'Be Vietnam Pro', sans-serif; color: #1C2B24; overflow: hidden; position: relative">
<div style="display: flex; align-items: center; gap: 12px">
<a href="AdultMeVi.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3DDD0; display: flex; align-items: center; justify-content: center; color: #1C2B24; flex-shrink: 0; cursor: pointer; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
<span style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 24px; line-height: 1.15">Lời nhắc</span>

</div>

</div>
<div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 18px; padding: 10px 14px">
<span style="color: #24463A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8 A6 6 0 0 1 18 8 C18 15 21 17 21 17 H3 C3 17 6 15 6 8"></path><path d="M10 21 H14"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Nhắc khi từ chín</span><span style="font-size: 12px; color: #5E6A62">Mỗi ngày một lần, chỉ khi có từ đã chín</span></span>
<button onClick="{{toggleOn}}" role="switch" aria-checked="{{onAria}}" aria-label="Nhắc khi từ chín" style="width: 48px; height: 30px; border-radius: 15px; border: none; background: {{onTrack}}; position: relative; cursor: pointer; padding: 0; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{onKnob}}; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; transition: left .2s"></span></button>
</div>
<sc-if value="{{on}}" hint-placeholder-val="{{true}}">
<div aria-hidden="true" style="position: relative; height: 128px; border-radius: 22px; overflow: hidden; background: {{sky}}; transition: background .4s">
<svg width="100%" viewBox="0 0 300 150" style="display: block; position: absolute; inset: 0; height: 100%">
<path d="M22 140 A128 120 0 0 1 278 140" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2" stroke-dasharray="3 6"></path>
<rect x="0" y="138" width="300" height="12" fill="#1B372D"></rect>
<g transform="translate(40,96)"><rect x="0" y="16" width="3" height="14" fill="#7FA487"></rect><circle cx="1.5" cy="16" r="4" fill="#9CC39A"></circle><rect x="26" y="8" width="3" height="22" fill="#7FA487"></rect><circle cx="27.5" cy="8" r="4" fill="#9CC39A"></circle><rect x="52" y="20" width="3" height="10" fill="#7FA487"></rect><circle cx="53.5" cy="20" r="4" fill="#9CC39A"></circle><rect x="78" y="4" width="3" height="26" fill="#7FA487"></rect><circle cx="79.5" cy="4" r="4" fill="#9CC39A"></circle><rect x="104" y="14" width="3" height="16" fill="#7FA487"></rect><circle cx="105.5" cy="14" r="4" fill="#9CC39A"></circle><rect x="130" y="10" width="3" height="20" fill="#7FA487"></rect><circle cx="131.5" cy="10" r="4" fill="#9CC39A"></circle><rect x="156" y="18" width="3" height="12" fill="#7FA487"></rect><circle cx="157.5" cy="18" r="4" fill="#9CC39A"></circle><rect x="182" y="6" width="3" height="24" fill="#7FA487"></rect><circle cx="183.5" cy="6" r="4" fill="#9CC39A"></circle><rect x="208" y="12" width="3" height="18" fill="#7FA487"></rect><circle cx="209.5" cy="12" r="4" fill="#9CC39A"></circle></g>
</svg>
<span style="position: absolute; left: {{sunX}}; top: {{sunY}}; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 17px; background: {{sun}}; box-shadow: 0 0 0 8px {{halo}}; transition: all .4s"></span>
<span style="position: absolute; right: 14px; top: 12px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; color: {{timeColor}}">{{time}}</span>
</div>
<div style="display: flex; gap: 6px"><sc-for list="{{presets}}" as="c" hint-placeholder-count="3"><button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-family: 'DM Sans', 'Be Vietnam Pro', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap">{{c.label}}</button></sc-for></div>
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 14px">Giờ tự động</span><span style="font-size: 12px; color: #5E6A62">Nhắc lúc có nhiều từ chín nhất</span></span>
<button onClick="{{toggleSmart}}" role="switch" aria-checked="{{smAria}}" aria-label="Giờ tự động" style="width: 48px; height: 30px; border-radius: 15px; border: none; background: {{smTrack}}; position: relative; cursor: pointer; padding: 0; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{smKnob}}; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; transition: left .2s"></span></button>
</div>
<div role="group" aria-label="Các ngày" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{days}}" as="c" hint-placeholder-count="7"><button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 40px; border-radius: 20px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; padding: 0">{{c.label}}</button></sc-for>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 18px; padding: 0 14px">
<div style="height: 34px; display: flex; align-items: center"><span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5E6A62">Nhắc tôi qua</span></div>
<sc-for list="{{chans}}" as="ch" hint-placeholder-count="3">
<div style="height: 46px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #EFEAE0">
<span style="flex-grow: 1; font-weight: 600; font-size: 15px; color: {{ch.fg}}">{{ch.label}}</span>
<sc-if value="{{ch.live}}" hint-placeholder-val="{{true}}"><button onClick="{{ch.toggle}}" role="switch" aria-checked="{{ch.aria}}" aria-label="{{ch.label}}" style="width: 48px; height: 30px; border-radius: 15px; border: none; background: {{ch.track}}; position: relative; cursor: pointer; padding: 0; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{ch.knob}}; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; transition: left .2s"></span></button></sc-if><sc-if value="{{ch.soon}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 700; color: #5E6A62; background: #EFEAE0; padding: 4px 10px; border-radius: 10px">Sắp có</span><button disabled aria-disabled="true" role="switch" aria-checked="false" aria-label="{{ch.label}} (Sắp có)" style="width: 48px; height: 30px; border-radius: 15px; border: none; background: #E3DDD0; position: relative; padding: 0; flex-shrink: 0; cursor: not-allowed; opacity: .6"><span style="position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></button></sc-if>
</div>
</sc-for>
</div>
<span style="font-size: 12px; color: #5E6A62; text-align: center">Giờ yên tĩnh: không nhắc từ 22:00 đến 7:00.</span>
</sc-if>
<sc-if value="{{off}}" hint-placeholder-val="{{false}}">
<div class="rise" style="background: #FBF4E4; border: 1px solid #EFD9A6; border-radius: 18px; padding: 14px; font-size: 14px; color: #6B5215; line-height: 1.45">Đã tắt lời nhắc. Từ đã chín vẫn chờ trong vườn, nhưng để lâu sẽ héo.</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: true, smart: false, time: '7:30', hh: 7.5, days: [1,1,1,1,1,1,0], push: true, zalo: false, email: false }; }
  renderVals() {
    const s = this.state;
    const pos = (hh) => { const a = Math.PI * (1 - (hh - 6) / 16); return { x: Math.round(150 + 128 * Math.cos(a)), y: Math.round(140 - 120 * Math.sin(a)) }; };
    const sw = (on) => ({ aria: on ? 'true' : 'false', track: on ? '#3E7F5A' : '#CFC8B8', knob: on ? '21px' : '3px' });
    const presets = [["7:30", 7.5, "Sáng"], ["12:30", 12.5, "Trưa"], ["21:00", 21, "Tối"]].map(([tm, hh, label]) => ({
      label: label + ' · ' + tm, pressed: s.time === tm ? 'true' : 'false',
      bg: s.time === tm ? '#24463A' : '#FFFFFF', fg: s.time === tm ? '#FFFFFF' : '#1C2B24', border: s.time === tm ? '#24463A' : '#E3DDD0',
      pick: () => this.setState({ time: tm, hh, smart: false })
    }));
    const days = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"].map((d, i) => ({
      label: d, pressed: s.days[i] ? 'true' : 'false', bg: s.days[i] ? '#24463A' : '#FFFFFF', fg: s.days[i] ? '#FFFFFF' : '#5E6A62', border: s.days[i] ? '#24463A' : '#E3DDD0',
      pick: () => { const n = s.days.slice(); n[i] = n[i] ? 0 : 1; this.setState({ days: n }); }
    }));
    const chans = [["push", "Thông báo", true], ["zalo", "Zalo", false], ["email", "Email", false]].map(([id, label]) => ({ label, ...sw(s[id]), live: id === 'push', soon: id !== 'push', fg: id === 'push' ? '#1C2B24' : '#8A928C', toggle: () => this.setState({ [id]: !s[id] }) }));
    const p = pos(s.hh);
    const night = s.hh >= 19;
    const sky = night ? 'linear-gradient(#24463A, #3E6B57)' : (s.hh < 10 ? 'linear-gradient(#F6E3DC, #FBF4E4)' : 'linear-gradient(#E3F0F8, #F4F1EA)');
    const m = sw(s.on), sm = sw(s.smart);
    return {
      presets, days, chans, time: s.smart ? "Tự động" : s.time, sky, sunX: (p.x / 3) + '%', sunY: (p.y / 1.5) + '%',
      sun: night ? '#F2D28B' : '#E0B04A', halo: night ? 'rgba(242,210,139,.18)' : 'rgba(224,176,74,.22)',
      timeColor: night ? '#F4F1EA' : '#24463A',
      on: s.on, off: !s.on, onAria: m.aria, onTrack: m.track, onKnob: m.knob, toggleOn: () => this.setState({ on: !s.on }),
      smAria: sm.aria, smTrack: sm.track, smKnob: sm.knob, toggleSmart: () => this.setState({ smart: !s.smart })
    };
  }
}
</script>
</body>
</html>
