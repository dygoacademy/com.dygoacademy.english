# Dygo Academy — Cloudflare Tunnel ingress config.
#
# Replaces the earlier Caddy + port-forwarding plan (2026-09-16): StarHub's
# public IP is dynamic and possibly CGNAT'd, so a plain A-record + open
# ports setup would be fragile or outright unreachable. A tunnel makes an
# outbound-only connection from this Mac to Cloudflare's edge — Cloudflare
# terminates TLS and proxies matching hostnames back down it. No public IP
# needed, no router port forwarding, works even behind CGNAT.
#
# Same three subdomains -> local ports as the old Caddyfile, mirroring the
# host:port pattern .env.stg already uses (see .env.prod's header comment):
#   www.dygoacademy.com      -> :3000 (frontend)
#   api.dygoacademy.com      -> :3001 (backend)
#   sso.dygoacademy.com      -> :8000 (Kong gateway; was supabase.dygoacademy.com
#                               until 2026-10-17, which still routes here
#                               while old app builds age out)
#   media.dygoacademy.com    -> :9100 (RustFS S3 API, bucket `media`, public
#                               read-only; added 2026-10-04)
#
# dygoacademy.com (no www) is NOT routed here: a Cloudflare Redirect Rule
# sends it to https://www.dygoacademy.com at the edge (README "Production").
#
# TUNNEL_ID / credentials-file below are placeholders -- fill them in after
# running `cloudflared tunnel create dygo-academy` (see README "Production
# — public domain"). credentials-file is the path `tunnel create` prints,
# normally ~/.cloudflared/<TUNNEL_ID>.json -- never commit that json file,
# it holds the tunnel's secret.

tunnel: f6169862-5054-48bc-8b45-746f33bc4cbe
credentials-file: /Users/dylan/.cloudflared/f6169862-5054-48bc-8b45-746f33bc4cbe.json

ingress:
  - hostname: www.dygoacademy.com
    service: http://localhost:3000
  - hostname: api.dygoacademy.com
    service: http://localhost:3001
  - hostname: sso.dygoacademy.com
    service: http://localhost:8000
  # Old Supabase host, kept so cached PWA builds and open tabs still sign
  # in after the move to sso (2026-10-17). Remove once they've aged out.
  - hostname: supabase.dygoacademy.com
    service: http://localhost:8000
  # RustFS keeps the Host header (media.dygoacademy.com) and maps it to the
  # `media` bucket (RUSTFS_SERVER_DOMAINS in docker-compose.yml). Writes need
  # signed requests; Cloudflare rules (README) allow only GET/HEAD here.
  - hostname: media.dygoacademy.com
    service: http://localhost:9100
  - service: http_status:404
